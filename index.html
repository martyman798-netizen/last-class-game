  if (e.dead) {
    e.deadT++;
    if (e.flee) { e.x += e.flee * 2.4; e.animT++; if (e.deadT > 200) e.deadT = 251; return; }
    stepRagdoll(e);
    e.x = clamp(e.x, WALL_L - 14, WALL_R + 14);
    if (gore && e.missing && e.missing.size && e.deadT < 110 && e.deadT % 6 === 0) {
      bloodSpray(e.x, e.y - (e.rag ? e.rag.z : 0) - 10, e.y, 2, 0, 0.8);
    }
    return;
  }

  const p = player;
  const dx = p.x - e.x, dy = p.y - e.y;
  const dist = Math.abs(dx);

  // airborne (juggled)
  if (e.st === 'air') {
    e.airY += e.airV; e.airV -= 0.32;
    e.x += e.vx; e.vx *= 0.86;
    if (e.airY <= 0) {
      if (e.bounce) {                       // spiked into the floor: one bounce to continue the juggle
        e.bounce = false; e.airY = 1; e.airV = 3.1;
        burst(e.x, e.y, 10, '#ffd23f', 2.6); ring(e.x, e.y, '#ffd23f', 4, 26);
        A.heavy(1.2); shake = 6;
      } else {
        e.airY = 0; e.airV = 0; e.setState('down', 70); A.down(); shake = 4;
      }
    }
    e.x = clamp(e.x, WALL_L - 10, WALL_R + 10);
    return;
  }

  switch (e.st) {
    case 'maimed':
      if (e.f <= 0) { e.setState('idle'); e.cool = rnd(10, 24); }
      break;
    case 'climb': stepEnemyClimb(e); break;
    case 'holding': {
      const p = player;
      if (p.st !== 'pinned' || p.pinBy !== e) { e.setState('idle'); e.cool = 20; break; }
      e.x = p.x - p.face * 11; e.y = p.y + 0.5; e.face = p.face; e.baseZ = p.baseZ || 0;
      break;
    }
    case 'revive': stepRevive(e); break;
    case 'thrown': {
      e.x += e.flyV; e.flyV *= 0.995;
      e.airY += e.airV; e.airV -= 0.38;
      // slam into anyone in the way
      enemies.forEach(o => {
        if (o === e || o.dead || o.st === 'thrown') return;
        if (Math.abs(o.x - e.x) < 20 && Math.abs(o.y - e.y) < 16 && Math.abs((o.airY || 0) - e.airY) < 30) {
          const dmg = Math.round(18 * (C().throwK || 1) * (1 + perk('throw')));
          o.hp -= dmg; e.hp -= 10;
          o.flash = 8; e.flash = 8;
          say(o.x, o.y - o.h, String(dmg), '#ffd23f');
          burst(o.x, o.y - o.h * 0.5, 14, '#ffd23f', 3);
          bloodSpray(o.x, o.y - o.h * 0.5, o.y, 8, sgn(e.flyV || 1), 1.2);
          A.heavy(1.1); shake = 8; hitStop = 6;
          o.vx += sgn(e.flyV || 1) * 6;
          e.flyV *= 0.2;
          const cut = trySever(o, Math.random() < 0.5 ? 'arm' : 'leg', dmg, o.hp <= 0, sgn(e.flyV || 1));
          if (o.hp <= 0) killEnemy(o); else if (!cut) o.setState('down', 70);
          if (e.hp <= 0) killEnemy(e);
        }
      });
      // and into the furniture
      props.forEach(o => {
        if (o.gone || (o.heavy > 9 && !o.hp)) return;
        if (Math.abs(o.x - e.x) < o.w + 12 && Math.abs(o.y - e.y) < o.d + 10 && e.airY < o.h + 16) {
          if (o.heavy < 9) punt(o, e.flyV * 1.2, 0, 2, 'body');
          damageProp(o, o.heavy > 9 ? 30 : 10, sgn(e.flyV || 1)); e.flyV *= 0.5;
        }
      });
      if (e.x <= WALL_L + 6 || e.x >= WALL_R - 6) {
        e.x = clamp(e.x, WALL_L + 6, WALL_R - 6);
        if (Math.abs(e.flyV) > 3) {
          e.hp -= 12; e.flash = 8; shake = 7;
          burst(e.x, e.y - 20, 12, '#b07a3f', 3);
          bloodSpray(e.x, e.y - 24, e.y, 7, -sgn(e.flyV), 1.1);
          A.heavy(0.9);
          say(e.x, e.y - 50, 'WALL', '#ff6b35');
        }
        e.flyV = -e.flyV * 0.35;
        if (e.hp <= 0) { killEnemy(e); break; }
      }
      if (e.airY <= 0) {
        e.airY = 0;
        e.hp -= 8; e.flash = 6;
        if (e.dropH) {                                    // a long way down
          const extra = Math.round(14 + e.dropH * 0.9);
          e.hp -= extra; e.dropH = 0;
          say(e.x, e.y - 60, 'CRATER  ' + extra, '#ff6b35', true);
          ring(e.x, e.y, '#ff6b35', 6, 60); dust(e.x, e.y, 16, 0); quake(e.x, 2);
          shake = 13; flashScreen = 6; hitStop = 9; A.crunch(1); styleAdd('offtop', 30); logEv('offtop');
          bloodSpray(e.x, e.y - 8, e.y, 12, sgn(e.flyV || 1), 1.3);
        }
        if (e.hp <= 0) { killEnemy(e); break; }
        e.setState('down', 72); A.down(); shake = 6;
        bloodSpray(e.x, e.y - 8, e.y, 5, sgn(e.flyV), 0.8);
      }
      break;
    }
    case 'enter': {
      const tx = e.x < LW / 2 ? WALL_L + 34 : WALL_R - 34;
      e.x += sgn(tx - e.x) * 1.6;
      if (Math.abs(e.x - tx) < 5) e.setState('idle');
      break;
    }
    case 'down':
      if (e.f <= 0) { e.setState('getup', 18); }
      e.x += e.vx; e.vx *= 0.86;
      break;
    case 'getup':
      if (e.f <= 0) { e.setState('idle'); e.cool = rnd(10, 22); }
      break;
    case 'stagger':
      if (e.f <= 0) { e.setState('idle'); e.cool = rnd(8, 20); }
      break;
    case 'hurt':
      if (e.f <= 0) e.setState('idle');
      break;
    case 'eblock':                                       // guard up; drop it and swing back
      e.face = sgn(player.x - e.x) || e.face;
      if (e.f <= 0) {
        e.setState('idle');
        if (e.blockPunish && !e.crawl) { e.blockPunish = false; e.cool = 0; e.hasToken = true; e.queue = pickMoves(e, e.t.near, true); }
      }
      break;
    case 'tele': {
      if (e.move.dash && e.f <= 0) e.vx = e.face * 0 ;
      if (e.f <= 0) {
        e.setState('act', e.move.act);
        if (e.move.dash) e.dashV = e.face * e.move.dash;
        if (e.move.shock) { shake = 7; ring(e.x, e.y, '#ff8a65', 6, e.move.reach); quake(e.x, 1); }
        if (e.move.flash) cameraFlash(e);
        if (e.move.zones) lotusBloom(e);
        if (e.move.summon && enemies.filter(o => !o.dead && !o.crowd).length < 4) {
          spawnQ.push(e.move.summon); spawnDelay = Math.min(spawnDelay, 10);
          say(e.x, e.y - 60, pick(['STAFF MEETING!', 'ALL HANDS!', 'WHO IS ON BREAK?!', 'CLOCK IN!']), '#ffd23f', true); A.tone(880, 660, 0.2, 'square', 0.08);
        }
        if (e.move.tree) { e.counterT = e.move.act; say(e.x, e.y - 74, 'TREE POSE', '#ce93d8', true); }
        if (e.move.flex) {
          e.armorT = e.move.act + 24;
          say(e.x, e.y - (e.baseZ || 0) - 72, 'MOST MUSCULAR!', '#ff5252', true);
          ring(e.x, e.y - 24, '#ffd23f', 5, 60); shake = Math.max(shake, 6); A.tone(110, 70, 0.5, 'sawtooth', 0.16);
          if (Math.abs(player.x - e.x) < 70 && Math.abs(player.y - e.y) < 30) player.vx += sgn(player.x - e.x) * 5;
        }
      }
      break;
    }
    case 'act': {
      const mv = e.move;
      if (mv.dash) {
        e.x += e.dashV; e.dashV *= 0.955;
        props.forEach(o => {
          if (o.gone || o.heavy > 9) return;
          if (Math.abs(o.x - e.x) < o.w + 12 && Math.abs(o.y - e.y) < o.d + 10) {
            punt(o, sgn(e.dashV || 1) * 6, 0, 2.2, 'enemy');
            damageProp(o, 6);
          }
        });
      }
      if (mv.shots) {
        const every = Math.max(1, Math.floor(mv.act / mv.shots));
        if (e.shotsLeft > 0 && (mv.act - e.f) % every === 0) {
          e.shotsLeft--;
          const fan = mv.shots > 3 ? (e.shotsLeft - (mv.shots - 1) / 2) * 0.13 : 0;
          const ang = Math.atan2(dy * 0.5, dx) + fan;
          const sp = mv.proj === 'burger' ? 3.4 : 2.9;
          shots.push({ x: e.x + e.face * 10, y: e.y - e.h * 0.55, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 190, spin: 0,
                       kind: mv.proj || 'orb', dmg: mv.proj === 'burger' ? Math.round(12 * (e.t.dmgK || 1)) : mv.proj === 'cup' ? 7 : mv.proj === 'om' ? 12 : mv.proj === 'taser' ? 7 : mv.proj === 'grease' ? 8 : mv.proj === 'tray' ? 6 : 11 });
          A.tele();
        }
      }
      if (mv.dmg && !e.hitDone && hitboxHits(e, p, mv.reach, mv.wide)) {
        e.hitDone = true;
        const res = hitPlayer(e, mv);
        if (res === 'parry') { e.hasToken = false; break; }
        if (res === 'hit' && mv.hug && !player.dead) startPinned(e);
      }
      if (e.f <= 0) {
        if (e.moveName === 'flop') {                   // he lands
          shake = 8; ring(e.x, e.y, '#ff8a65', 6, 44); dust(e.x, e.y, 10, 0); A.land(true); quake(e.x, 1);
        }
        e.setState('rec', mv.rec);
      }
      break;
    }
    case 'rec': {
      if (e.move && e.move.dash < 0) e.x += e.move.dash * 0.5;
      if (e.f <= 0) {
        while (e.queue.length && !canDo(e, e.queue[0])) e.queue.shift();
        if (e.queue.length) startEMove(e, e.queue.shift());
        else { e.setState('idle'); e.hasToken = false; e.cool = rnd(10, 28); }
      }
      break;
    }
    default: {                                  // idle / approach
      if (e.crowd) { stepCrowd(e); break; }
      if (e.ropeT > 0) break;                                       // still coming down the rope
      if (e.leaving) { e.face = -1; e.x -= 1.9; e.mvx = -1.9; e.mvy = 0; if (e.x < WALL_L - 50) e.exited = true; break; }
      if (e.t.role === 'medic' && stepMedic(e)) break;
      if (e.t.role === 'dummy' && !(tutorial && tutorial.attack)) { if (Math.abs(dx) > 2) e.face = sgn(dx); break; }
      if (Math.abs(dx) > 2) e.face = sgn(dx);
      if (e.cool > 0) e.cool--;
      if (e.climbCool > 0) e.climbCool--;

      steerEnemy(e, dx, dy, dist);
      { const P = enemyWantsUp(e, dist); if (P) { startEnemyClimb(e, P); break; } }

      // try to claim an attack token
      if (!e.hasToken && e.cool <= 0 && tokensHeld() < attackToken + (player.st === 'pinned' ? 2 : 0) && dist < e.t.gap[1] + 40
          && p.st !== 'down' && !p.dead) {
        e.hasToken = true;
      }
      if (e.hasToken && e.cool <= 0) {
        if (!e.queue.length) {
          if (dist > e.t.gap[1] && !e.crawl) {
            // far: sometimes commit to a ranged opener, otherwise keep closing
            const far = pickMoves(e, e.t.far, false);
            if (far.length && Math.random() < 0.35) e.queue = far;
            else e.cool = 7;
          } else {
            e.queue = pickMoves(e, e.t.near, true);
          }
        }
        if (e.queue.length) {
          const first = EMOVES[e.queue[0]];
          // must actually be in range, or keep walking - otherwise they swing at thin air
          const okRange = first.dash || !first.dmg || (dist < first.reach - 4 && depthGap(e) < DEPTH_BAND + (first.wide ? 10 : 0) - 2);
          if (okRange) { e.wantRange = 0; startEMove(e, e.queue.shift()); }
          else { e.cool = 4; e.wantRange = Math.max(8, first.reach - 12); }
        }
      }

      break;
    }
  }
  if (e.t.boss && !e.dead) bossPhase(e);

  e.x += e.vx; e.vx *= 0.84;
  if (e.wallT > 0) e.wallT--;
  if (e.domT > 0) e.domT--;
  if (!e.dead && Math.abs(e.vx) > 2.6 && (e.st === 'hurt' || e.st === 'down' || e.st === 'stagger') && !e.propT) {
    props.forEach(o => {
      if (o.gone || o.heavy < 9 || !o.hp || e.propT) return;
      if (o.flat) {                                         // slammed down onto a yoga mat: it tears
        if (Math.abs(o.x - e.x) < o.w + 4 && Math.abs(o.y - e.y) < o.d + 4 && e.st === 'down' && !e.matT) { e.matT = 40; damageProp(o, 7); }
        return;
      }
      if (Math.abs(o.x - e.x) < o.w + 9 && Math.abs(o.y - e.y) < o.d + 9) {
        e.propT = 24; e.vx *= 0.45;
        e.hp -= 6; e.flash = 6; say(e.x, e.y - e.h - 6, 'CRASH 6', PROPT[o.type].col || '#fff');
        damageProp(o, 30, sgn(e.vx || 1)); A.crunch(0.6);
        if (e.hp <= 0) killEnemy(e);
      }
    });
  }
  if (e.propT > 0) e.propT--;
  if (e.shoveT > 0) e.shoveT--;
  if (e.armorT > 0) e.armorT--;
  if (e.hopT > 0) e.hopT--;
  if (e.counterT > 0) { e.counterT--; if (e.st !== 'act') e.counterT = 0; }
  if (e.ropeT > 0) e.ropeT--;
  if (e.pipDecay > 0 && --e.pipDecay === 0) e.pips = 0;
  if (e.brokenT > 0) e.brokenT--;
  if (e.matT > 0) e.matT--;
  if (!e.dead) stepPuddleOn(e);
  if (!e.dead && Math.abs(e.vx) > 2.6 && (e.st === 'hurt' || e.st === 'down' || e.st === 'stagger')) {
    if ((e.x <= WALL_L + 8 || e.x >= WALL_R - 8) && !e.wallT) wallSplat(e);
    else enemies.forEach(o => {
      if (o === e || o.dead || o.domT || o.finLock || o.st === 'down' || o.st === 'air' || o.st === 'thrown') return;
      if (Math.abs(o.x - e.x) < 20 && Math.abs(o.y - e.y) < 14 && sgn(o.x - e.x) === sgn(e.vx)) domino(o, e);
    });
  }
  if (e.hitByProp > 0) e.hitByProp--;
  if (e.crowd) { if (e.x > WALL_R + 60 || e.x < WALL_L - 60) e.exited = true; }
  if (e.leaving && e.x < WALL_L - 40) e.exited = true;
  else e.x = clamp(e.x, WALL_L - 10, WALL_R + 10);
  e.y = clamp(e.y, DEPTH_TOP, FLOOR_BOT);
  if (e.st !== 'enter' && e.st !== 'climb' && !(e.crowd && (e.ghost || e.x < WALL_L || e.x > WALL_R))) collideProps(e);
  enemyGround(e);
}

/* knocked into the wall: it hurts, and it counts toward the combo */
function wallSplat(e) {
  e.wallT = 30; logEv('wall');
  const dmg = Math.round(9 * (C().throwK || 1));
  e.hp -= dmg; e.flash = 8; e.vx = -e.vx * 0.3;
  const wx = e.x < LW / 2 ? WALL_L : WALL_R, sy = e.y - e.h * 0.5;
  impact(wx, sy, -sgn(e.vx || 1), true); dust(wx, e.y, 8, 0);
  bloodSpray(wx, sy, e.y, 8, sgn(e.vx || 1), 1.1);
  A.crunch(0.9); shake = Math.max(shake, 8); hitStop = Math.max(hitStop, 5);
  say(e.x, e.y - e.h - 6, 'WALL! ' + dmg, '#ff6b35', true);
  crackWall(wx); quake(wx, 1);
  addCombo(); score += 60;
  if (e.hp <= 0) killEnemy(e);
  else if (!e.t.boss) { e.setState('down', 56); e.poise = e.maxpoise; }
}
/* knocked into a friend: they both go over */
function domino(o, e) {
  o.domT = 30; logEv('domino');
  o.hp -= 7; o.flash = 8; o.vx += e.vx * 0.7; e.vx *= 0.5;
  impact(o.x - sgn(e.vx || 1) * 6, o.y - o.h * 0.5, sgn(e.vx || 1), false);
  A.crunch(0.6); shake = Math.max(shake, 6);
  say(o.x, o.y - o.h - 6, 'DOMINO!', '#ffd23f', true);
  addCombo(); score += 60;
  if (o.hp <= 0) killEnemy(o);
  else if (!o.t.boss) { o.hasToken = false; o.queue = []; o.setState('down', 50); o.poise = o.maxpoise; }
}

/* ============================== WORLD UPDATE ============================== */
function update() {
  stateT++;
  tickBuf();
  if (state !== 'select' && state !== 'loot' && state !== 'title' && state !== 'levelup') menuQ.length = 0;
  if (menu) { menuQ.length = 0; clearEdges(); return; }
  if (state === 'play' && !paused && isPortrait()) togglePause();
  if (paused) { clearEdges(); return; }
  if (flashScreen > 0) flashScreen--;
  camKX *= 0.72; camKY *= 0.72;

  // a new kind of client walks in: freeze on their name card
  if (introCard && !introCard.full && ++introCard.t > 240) introCard = null;     // shown in the corner; nothing stops

  if (hitStop > 0) { hitStop--; clearEdges(); return; }
  if (shake > 0.4) shake *= 0.85;

  if (state === 'title') { updateTitle(); return; }
  if (state === 'select') { updateSelect(); return; }
  if (state === 'loot') { updateLoot(); return; }
  if (state === 'over' || state === 'win') {
    const go = stateT > 70 && startPressed();
    clearEdges(); eat(['space', 'enter', 'j', 'k']);
    if (go) { resetGame(); if (!scene) { state = 'play'; stateT = 0; } }
    stepParts();
    return;
  }
  if (state === 'clear') { updateClear(); return; }
  if (state === 'scene') { updateScene(); return; }
  if (state === 'door') { updateDoor(); return; }
  if (state === 'intro') { if (introCard) updateIntroCard(); else state = 'play'; return; }
  if (state === 'levelup') { if (lvlCard) updateLevelUp(); else state = 'play'; return; }
  if (state === 'credits') { updateCredits(); return; }
  if (state === 'stage') {
    const go = stateT > 40 && startPressed();
    clearEdges(); eat(['space', 'enter', 'j', 'k']);
    if (go || stateT > 170) {                            // a quick cut to the next place, no button needed
      state = 'play'; stateT = 0;
      const heal = Math.min(40, player.maxhp - player.hp);   // he did get his snack
      player.hp += heal;
      enemies = []; shots = []; pickups = []; clearBlood(); clearScene();
      startRound(); saveCheckpoint();
      if (heal > 0) say(player.x, player.y - 60, 'SNACK +' + Math.round(heal), '#8bc34a', true);
    }
    return;
  }

  // slow motion: the world only moves every third frame
  if (slowMo > 0) {
    slowMo--;
    if (slowMo === 0) { focus = null; M.muffle(false); }
    if (slowMo % 3) { clearEdges(); return; }
  }
  if (comboT > 0) { comboT--; if (comboT === 0) combo = 0; }

  classTime++;
  updatePlayer();
  enemies.forEach(e => { e._px = e.x; e._py = e.y; });
  if (witchT > 0) witchT--;
  if (!(witchT > 0) || classTime % 3 === 0) enemies.forEach(updateEnemy);
  if (tutorial && state === 'play') {
    if (tutorial.done) { if (--tutorial.done <= 0) { tutorial = null; flowOff = false; state = 'title'; stateT = 0; titleSel = titleItems().indexOf('NEW GAME'); M.play('title'); enemies = []; } }
    else stepTutorial();
  }
  enemies.forEach(e => {
    e.mvx = (e.mvx || 0) * 0.7 + (e.x - e._px) * 0.3;
    e.mvy = (e.mvy || 0) * 0.7 + (e.y - e._py) * 0.3;
  });
  const stillHere = [];
  enemies.forEach(e => {
    if (e.exited && !e.dead) { if (worldEv) worldEv.through++; }
    else if (e.dead && e.deadT > 250) {
      if (!e.crowd && Math.random() < 0.32) pickups.push({ x: e.x, y: e.y, t: 0 });
    } else stillHere.push(e);
  });
  enemies = stillHere;

  if (!(witchT > 0) || classTime % 3 === 0) stepShots();
  stepPickups(); stepParts(); stepProps(); stepLoot(); stepWreck(); stepRaid(); stepAbsurd();
  if (autoTree && pendingPicks > 0 && state === 'play' && ['idle', 'walk', 'run'].includes(player.st) && !player.carry && !player.dead) { autoTree = false; openTree(); }
  if (treeReq) { treeReq = false; if (state === 'play' && progression()) openTree(); }
  if (state === 'loot') return;
  stepWorldEvent();
  stepTrails();

  if (banner && --banner.t <= 0) banner = null;

  const cap = bossRound(round) ? 3 : 4;
  const alive = enemies.reduce((n, e) => n + (e.dead || e.crowd || e.leaving ? 0 : 1), 0);   // bodies lie around; crowds are passing through
  if (spawnQ.length) {
    if (--spawnDelay <= 0 && alive < cap) { spawnEnemy(spawnQ.shift()); spawnDelay = 66; }
  } else if (player.hp > 0 && !worldEv && !evPending() && !flowOff) {
    // one long fight: the next wave walks in while the last one is still finishing - no score card in between
    const end = stageEnd(round), boss = round + 1 < ROUNDS.length && bossRound(round + 1);
    const newRoom = !end && roomKey(round + 1) !== roomKey(round);
    if (!end && (boss || newRoom ? !alive && slowMo <= 0 : alive <= 1)) nextWave();
    else if (end && !alive && slowMo <= 0) finishStage();
  }

  if (player.hp <= 0 && state === 'play' && perk('revive') && !player.revived) {
    const p = player;                                  // once per stage: back on your feet
    p.revived = true; p.hp = 40; p.iframes = 120; p.setState('down', 50);
    say(p.x, p.y - 70, { yoga: 'SAVASANA', bb: 'LAST SET', cyc: 'SECOND WIND' }[CLS], '#8bc34a', true);
    ring(p.x, p.y, '#8bc34a', 6, 60); flashScreen = 8; A.rank();
  }
  if (player.hp <= 0 && state === 'play') {
    state = 'over'; stateT = 0; shake = 11; A.ko();
    slowMo = 0; focus = null; M.muffle(true); saveBest();
  }
}

/* the grade card between rounds: rows tick in, the letter stamps down, the bonus counts up */
function updateClear() {
  const c = clear;
  stepParts();
  if (stateT % 16 === 0 && c.shown < c.rows.length + 1) {
    c.shown++;

  pickups.forEach(k => {
    k.t++;
    if (Math.abs(k.x - player.x) < 22 && Math.abs(k.y - player.y) < 15) {
      const heal = (k.burger ? 12 : 18) * (1 + perk('snack'));
      player.hp = Math.min(player.maxhp, player.hp + heal);
      player.stam = Math.min(player.maxstam, player.stam + 35);
      say(k.x, k.y - 22, '+' + heal, '#8bc34a');
      burst(k.x, k.y - 8, 8, '#4fc3f7'); A.pickup();
      k.gone = true;
    }
    if (k.t > 620) k.gone = true;
  });
  pickups = pickups.filter(k => !k.gone);
}

function stepParts() {
  parts.forEach(p => {
    if (p.ring) { p.r += (p.r1 - p.r) * 0.3; p.life--; return; }
    if (p.star) { p.life--; return; }
    if (p.streak) { p.x += p.vx; p.y += p.vy; p.vx *= 0.8; p.vy *= 0.8; p.life--; return; }
    if (p.grow) p.s += p.grow;
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.blood && p.y >= p.gy) { stainFloor(p.x, p.gy, p.s < 1.4 ? 2 : 3); p.life = 0; }
  });
  parts = parts.filter(p => p.life > 0);
  floats.forEach(f => { f.y += f.vy; f.life--; });
  floats = floats.filter(f => f.life > 0);
}

/* ============================== RENDER ============================== */
function drawRaw(s, x, y, face, squash, stretch, mode) {
  const w = s.w * SCALE * (stretch || 1), h = s.h * SCALE * (squash || 1);
  let src = s.img;
  if (mode === 'white') src = s.white;
  else if (mode === 'red') src = s.red;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(face, 1);
  ctx.drawImage(src, Math.round(-w / 2), Math.round(-h), w, h);
  ctx.restore();
}

function drawGym() {
  if (state !== 'title' && ROOMS[curRoom()] && ROOMS[curRoom()].draw) { ROOMS[curRoom()].draw(); return; }
  if (state !== 'title' && stageOf(round) === 2) { drawDiner(); return; }
  if (state !== 'title' && stageOf(round) === 3) { drawStreet(); return; }
  if (state !== 'title' && stageOf(round) === 4) { drawHome(); return; }
  const md = MOODS[state === 'title' ? 0 : ROUNDS[Math.min(round, ROUNDS.length - 1)].mood];
  ctx.fillStyle = md.wall; ctx.fillRect(0, 0, LW, FLOOR_TOP);
  ctx.fillStyle = md.top; ctx.fillRect(0, 0, LW, 34);
  ctx.fillStyle = md.win; ctx.fillRect(24, 44, LW - 48, 78);
  ctx.fillStyle = md.winTop; ctx.fillRect(24, 44, LW - 48, 10);
  if (md.glow) {                                  // class lighting: a strip of lamps that pulses with the beat
    const beat = Math.floor(classTime / 14) % 2;
    for (let i = 0; i < 12; i++) {
      const on = (i + beat) % 2 === 0;
      ctx.fillStyle = md.glow[i % 2];
      ctx.globalAlpha = on ? 0.9 : 0.25;
      ctx.fillRect(18 + i * 39, 26, 14, 4);
      ctx.globalAlpha = on ? 0.10 : 0.03;
      ctx.beginPath(); ctx.moveTo(18 + i * 39, 30); ctx.lineTo(32 + i * 39, 30);
      ctx.lineTo(46 + i * 39, FLOOR_TOP); ctx.lineTo(4 + i * 39, FLOOR_TOP); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for (let i = 0; i < 4; i++) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(40 + i * 110, 48, 22, 70); }
  ctx.fillStyle = '#2b2440';
  for (let i = 1; i < 4; i++) ctx.fillRect(24 + i * (LW - 48) / 4 - 2, 44, 4, 78);
  ctx.fillStyle = '#ff6b35'; ctx.fillRect(LW - 92, 56, 54, 36);

  ctx.strokeStyle = '#2b2440'; ctx.lineWidth = 2;
  const a1 = classTime * 0.01, a2 = classTime * 0.1;
  ctx.beginPath(); ctx.moveTo(CKX, CKY); ctx.lineTo(CKX + Math.cos(a1) * 7, CKY + Math.sin(a1) * 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CKX, CKY); ctx.lineTo(CKX + Math.cos(a2) * 11, CKY + Math.sin(a2) * 11); ctx.stroke();
  ctx.fillStyle = '#3b3356'; ctx.fillRect(132, 136, 120, 4); ctx.fillRect(132, 148, 120, 4);
  for (let i = 0; i < 6; i++) {
    const dx = 140 + i * 19, sz = 3 + (i % 3);
    ctx.fillStyle = '#4a4268'; ctx.fillRect(dx - 1, 130 - sz, 10, 6 + sz);
    ctx.fillStyle = '#6d6192'; ctx.fillRect(dx - 2, 130 - sz, 3, 6 + sz); ctx.fillRect(dx + 6, 130 - sz, 3, 6 + sz);
  }
  ctx.fillStyle = '#2f2849'; ctx.fillRect(300, 132, 64, 7);
  ctx.fillStyle = '#453c66'; ctx.fillRect(300, 132, 64, 3);
  ctx.fillStyle = '#241e3b'; ctx.fillRect(306, 139, 5, 14); ctx.fillRect(353, 139, 5, 14);
  ctx.fillStyle = '#1d1830'; ctx.fillRect(0, FLOOR_TOP - 12, LW, 12);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 2 ? '#b97a3f' : '#c98a4b'; ctx.fillRect(i * 36, FLOOR_TOP, 36, LH - FLOOR_TOP); }
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  for (let i = 0; i < 5; i++) ctx.fillRect(0, FLOOR_TOP + i * 22, LW, 2);
  ctx.fillStyle = '#7e57c2'; ctx.fillRect(40, FLOOR_BOT + 2, 60, 9);
  ctx.fillStyle = '#26a69a'; ctx.fillRect(LW - 112, FLOOR_BOT + 2, 60, 9);

}

/* ============================== ROOMS & WRECKAGE ==============================
   Every stage is a few rooms you fight your way through. Each room remembers what you did to it,
   and everything in it breaks: the furniture, the pictures on the wall - and, if the fight goes on
   long enough, the building itself. */
const DEFAULT_ROOM = { 1: 'gym', 2: 'diner', 3: 'street', 4: 'living' };
const roomKey = r => { const R = ROUNDS[Math.min(r, ROUNDS.length - 1)]; return R.room || DEFAULT_ROOM[R.stage || 1] || 'gym'; };
const curRoom = () => state === 'title' ? 'title' : roomKey(round);

const freshWreck = () => ({ lvl: 0, said: 0, collapsed: false, holes: [], nextChunk: 0 });
const FR = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const roomMood = () => MOODS[ROUNDS[Math.min(round, ROUNDS.length - 1)].mood] || {};
function dimRoom() { const l = roomMood().light; if (l != null && l < 1) FR('rgba(10,4,16,' + (1 - l) * 0.6 + ')', 0, 0, LW, LH); }
function boards(c1, c2) {
  for (let y = FLOOR_TOP, k = 0; y < LH; y += 9, k++) { FR(k % 2 ? c1 : c2, 0, y, LW, 9);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let x = (k * 37) % 60; x < LW; x += 60) ctx.fillRect(x, y, 1, 9); }
}
function tiles(c1, c2, size, y0, y1) {
  for (let y = y0, j = 0; y < y1; y += size, j++) for (let x = 0, i = 0; x < LW; x += size, i++) FR((i + j) % 2 ? c1 : c2, x, y, size, Math.min(size, y1 - y));
}

function drawActor(a, isP) {

  switch (a.st) {
    case 'tele': {

      ctx.save(); ctx.globalAlpha = 0.22;
      drawRaw(s, a.x - a.vx * 2.2, gy, a.face, 0.92, 1.18, 'white');
      drawRaw(s, a.x - a.vx * 1.1, gy, a.face, 0.92, 1.18, 'white');
      ctx.restore();
      break;
    }
    case 'air': stretch = 0.97; break;
  }

  if (a.flash > 0 && Math.floor(a.flash / 2) % 2 === 0) mode = 'white';
  if (!isP && a.st === 'act' && a.moveName === 'flop' && a.move) {      // airborne belly flop
    const k = 1 - a.f / a.move.act;
    yoff -= Math.round(Math.sin(k * Math.PI) * 18);
  }
  if (a.vibeUntil > stateT) lean += (stateT % 2 ? 1 : -1) * (a.vibeAmp || 1);   // shudder while the hit freezes
  if (a.trail && a.trail.length) {                       // afterimages on fast moves
    a.trail.forEach((g, i) => {
      ctx.globalAlpha = 0.12 + 0.09 * i;
      drawCharFrame(g.who, g.fr, g.x, g.y, g.face, isP ? 'ghostB' : 'ghostR', 0, g.missing);
    });
    ctx.globalAlpha = 1;
  }
  const flowing = ['dodge', 'vault', 'roll', 'wallkick', 'mantle', 'cutter'].includes(a.st) || a.flipT > 0;    // parkour reads as one clean motion
  if (isP && a.iframes > 0 && !flowing && Math.floor(a.iframes / 3) % 2 === 0) ctx.globalAlpha = 0.42;

  if (isP && PF) {
    drawPlayerFrame(a, a.x + lean, gy + yoff, mode);
    if (a.weapon && !['down', 'mantle', 'roll', 'cutter', 'finish'].includes(a.st)) drawHeldWeapon(a, a.x + lean, gy + yoff);
  } else if (!isP && FS[a.sprName]) {
    let push = 0;
    if (a.moveName === 'headbutt' && a.st === 'act') push = a.face * 8;
    if (a.crawl && a.st === 'act') push = a.face * 6;
    drawCharFrame(a.sprName, enemyFrame(a), a.x + lean + push, gy + yoff, a.face, mode, 0, a.missing);
  } else if (s.rig && a.st !== 'down') {
    drawRigged(s, s.rig, a.x + lean, gy + yoff, a.face, squash, stretch, mode, poseFor(a, isP));
  } else {
    drawRaw(s, a.x + lean, gy + yoff, a.face, squash, stretch, mode);
  }
  ctx.globalAlpha = 1;

  // swing arc
  if ((a.st === 'attack' || a.st === 'act') && a.move && a.move.reach) {
    const mv = a.move, total = mv.wind + mv.act + mv.rec, el = total - a.f;
    if (el >= mv.wind && el < mv.wind + mv.act) {
      const k = (el - mv.wind) / Math.max(1, mv.act);
      ctx.save();
      ctx.translate(a.x, gy - a.h * (mv.pose === 'kick' ? 0.2 : 0.5));
      ctx.scale(a.face, 1);
      ctx.globalAlpha = 0.5 * (1 - k);
      ctx.strokeStyle = mv.pose === 'kick' ? '#ffd23f' : '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, mv.reach * 0.7, -0.95 + k * 0.55, 0.65 + k * 0.55);
      ctx.stroke();
      ctx.restore();
    }
  }

  // block shield
  if (isP && a.st === 'block') {
    const bx = a.x + a.face * 15, by = gy - a.h * 0.55;
    ctx.strokeStyle = a.blockT <= 9 ? '#fff' : '#9fd0ff';
    ctx.lineWidth = a.blockT <= 9 ? 3 : 2;
    ctx.beginPath();
    ctx.arc(bx, by, 15, -1.1 + (a.face < 0 ? Math.PI : 0), 1.1 + (a.face < 0 ? Math.PI : 0));
    ctx.stroke();
  }

  // finisher prompt: a skull over anyone you can execute right now
  if (!isP && !a.dead && state === 'play' && finishable(a) && Math.abs(a.x - player.x) < 70 && Math.abs(a.y - player.y) < 24
      && player.st !== 'finish') {
    const cx = Math.round(a.x), cy = Math.round(gy - a.h - 16) + (stateT % 30 < 15 ? 0 : -1);
    ctx.fillStyle = '#000'; ctx.fillRect(cx - 6, cy - 6, 13, 13);
    ctx.fillStyle = stateT % 16 < 8 ? '#fff' : '#ffd23f';
    ctx.fillRect(cx - 5, cy - 5, 11, 7); ctx.fillRect(cx - 3, cy + 2, 7, 3);
    ctx.fillStyle = '#000'; ctx.fillRect(cx - 3, cy - 3, 2, 3); ctx.fillRect(cx + 2, cy - 3, 2, 3);
    ctx.fillRect(cx - 1, cy + 2, 1, 2); ctx.fillRect(cx + 1, cy + 2, 1, 2);
    ctx.font = 'bold 6px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(isTouch() ? 'TAP' : 'HEAVY', cx + 1, cy - 8);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(isTouch() ? 'TAP' : 'HEAVY', cx, cy - 9);
    ctx.textAlign = 'left';
  }
  // telegraph bar + mark
  if (a.st === 'tele' && a.move) {
    const red = a.move.kind === 'red';
    const k = 1 - a.f / a.move.wind;
    const bw = Math.max(30, a.w * 0.8);
    const top = gy - a.h - 9;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(a.x - bw / 2 - 1, top - 1, bw + 2, 6);
    ctx.fillStyle = red ? '#ff3b3b' : '#fff';
    ctx.fillRect(a.x - bw / 2, top, bw * k, 4);
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    // the moment to react: BLOCK for a white attack (that is a parry, and a counter), JUMP for a red one
    const win = red ? 12 : C().parry + perk('parry');
    if (a.f <= win && !isP) {
      const pulse = 1 + (a.f % 4 < 2 ? 0.25 : 0), r = Math.round(7 * pulse), cx = Math.round(a.x), cy = top - 12;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.moveTo(cx, cy - r - 2); ctx.lineTo(cx + r + 2, cy); ctx.lineTo(cx, cy + r + 2); ctx.lineTo(cx - r - 2, cy); ctx.fill();
      ctx.fillStyle = red ? '#ff3b3b' : '#4fc3f7';
      ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace';
      ctx.fillText(red ? '^' : '!', cx, cy + 3);
      ctx.font = 'bold 6px monospace'; ctx.fillStyle = '#000'; ctx.fillText(red ? 'JUMP' : 'BLOCK', cx + 1, cy - r - 4);
      ctx.fillStyle = red ? '#ff6b6b' : '#fff'; ctx.fillText(red ? 'JUMP' : 'BLOCK', cx, cy - r - 5);
    } else if (a.f % 8 < 6) {
      ctx.fillStyle = '#000'; ctx.fillText(red ? '!!' : '!', a.x + 1, top - 4);
      ctx.fillStyle = red ? '#ff3b3b' : '#fff'; ctx.fillText(red ? '!!' : '!', a.x, top - 5);
    }
    // dash lane marker
    if (a.move.dash > 0) {
      ctx.fillStyle = red ? 'rgba(255,59,59,.3)' : 'rgba(255,255,255,.2)';
      ctx.fillRect(a.x, a.y - 3, a.face * 110, 3);
    }
  }

  // hp bar
  if (!isP) {
    const w = a.t.boss ? 46 : 26, hp = clamp(a.hp / a.maxhp, 0, 1);
    const top = gy - a.h - 7;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(a.x - w / 2, top, w, 3);
    ctx.fillStyle = hp > 0.4 ? '#8bc34a' : '#ff5252';
    ctx.fillRect(a.x - w / 2, top, w * hp, 3);
  }
}

function render() {
  ctx.save();
  if (shake > 0.4 && SET.shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  if (Math.abs(camKX) > 0.5 || Math.abs(camKY) > 0.5) ctx.translate(Math.round(camKX), Math.round(camKY));
  if (focus && slowMo > 6) {                       // whole-pixel 2x close-up on the final kill
    const Z = 2;
    const fx = clamp(Math.round(focus.x), LW / (2 * Z), LW - LW / (2 * Z));
    const fy = clamp(Math.round(focus.y), LH / (2 * Z), LH - LH / (2 * Z));
    ctx.translate(LW / 2, LH / 2); ctx.scale(Z, Z); ctx.translate(-fx, -fy);
  }
  drawGym();

  drawWallDamage();
  drawRuin(); drawDecor(); drawRaidFX();
  if (debrisLayer) ctx.drawImage(debrisLayer, 0, 0);
  props.forEach(o => { if (o.flat && !o.gone) drawProp(o); });   // yoga mats, under everything
  drawPuddles();
  if (bloodLayer) ctx.drawImage(bloodLayer, 0, 0);
  drawLootOnFloor();
  if (state !== 'title') drawChunkShadows();

  if (state === 'title') { ctx.restore(); drawTitle(); if (menu) drawMenu(); return; }

  pickups.forEach(k => {
    const bob = Math.sin(k.t * 0.12) * 2;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(k.x, k.y, 7, 3, 0, 0, 7); ctx.fill();
    if (k.burger) {                                  // dropped in the rush
      const y = Math.round(k.y - 9 + bob);
      ctx.fillStyle = '#ff9800'; ctx.fillRect(k.x - 6, y - 4, 12, 4); ctx.fillRect(k.x - 6, y + 4, 12, 2);
      ctx.fillStyle = '#8bc34a'; ctx.fillRect(k.x - 7, y, 14, 1);
      ctx.fillStyle = '#5d4037'; ctx.fillRect(k.x - 6, y + 1, 12, 3);
      return;
    }
    ctx.fillStyle = '#4fc3f7'; ctx.fillRect(k.x - 3, k.y - 14 + bob, 6, 12);
    ctx.fillStyle = '#fff'; ctx.fillRect(k.x - 3, k.y - 14 + bob, 6, 3);
    ctx.fillStyle = '#0277bd'; ctx.fillRect(k.x - 2, k.y - 17 + bob, 4, 3);
  });

  const actors = [player, ...enemies];
  actors.forEach(a => {
    if (a.baseZ > 0 && !a.dead) return;                            // drawn on top of what they're standing on, below
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    const sw = a.spr.w * SCALE * 0.34 * (1 - Math.min(0.55, (a.airY || 0) / 90));
    ctx.beginPath(); ctx.ellipse(a.x, a.y, sw, 4, 0, 0, 7); ctx.fill();
    if (a.crowd && !a.dead) {                       // passing through: a ring in the event's colour so you can tell them apart
      const ev = WORLD_EVENTS[evKey()];
      ctx.strokeStyle = ev ? ev.col : '#fff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.ellipse(a.x, a.y, sw + 3, 5, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  });
  const all = [];
  // up on something: draw him after it, and his shadow on its top
  const upOn = a => a.baseZ > 0 && a.under ? a.under
    : (a.st === 'mantle' || a.st === 'climb') && a.pk && a.pk.o && (a === player ? a.airY : a.baseZ) > a.pk.top - 12 ? a.pk.o : null;
  actors.forEach(a => { const u = !a.dead && upOn(a); all.push({ y: u ? Math.max(a.y, u.y + 0.5) : a.y, a }); });
  props.forEach(o => { if (!o.gone && !o.flat) all.push({ y: o.y, o }); });
  all.sort((m, n) => m.y - n.y);
  all.forEach(it => {
    if (it.o) { drawProp(it.o); return; }
    const a = it.a;
    if (a.baseZ > 0 && !a.dead) {
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath();
      ctx.ellipse(a.x, a.y - a.baseZ, 9 * (1 - Math.min(0.55, (a.airY || 0) / 90)), 3, 0, 0, 7); ctx.fill();
    }
    drawActor(it.a, it.a === player);
  });

  drawHints();                                     // what you could climb or cutter right now
  drawChunks(); drawExiting();
  shots.forEach(s => {
    if (s.kind === 'grease') {                     // a blob of fryer oil
      ctx.fillStyle = '#ffb300'; ctx.beginPath(); ctx.arc(Math.round(s.x), Math.round(s.y), 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff59d'; ctx.fillRect(Math.round(s.x) - 1, Math.round(s.y) - 2, 1, 1);
      if (classTime % 2) parts.push({ x: s.x, y: s.y, vx: -s.vx * 0.1, vy: 0.3, g: 0.1, life: 10, col: '#ffb300', s: 1 });
      return;
    }
    if (s.kind === 'tray') {                       // a spinning plastic tray
      const w = Math.abs(Math.cos(classTime * 0.4)) * 7 + 1;
      ctx.fillStyle = '#c62828'; ctx.fillRect(Math.round(s.x - w), Math.round(s.y) - 1, Math.round(w * 2), 3);
      return;
    }
    if (s.kind === 'taser') {                      // two little darts on a crackling wire
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(s.x) - 2, Math.round(s.y) - 1, 4, 2);
      ctx.strokeStyle = (classTime >> 1) % 2 ? '#fff59d' : '#4fc3f7'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(s.x, s.y);
      for (let k = 1; k < 5; k++) ctx.lineTo(s.x - (s.vx > 0 ? 1 : -1) * k * 5, s.y + ((k % 2) ? -2 : 2)); ctx.stroke();
      return;
    }
    if (s.kind === 'om') {                         // a ring of purple calm, flying at your face
      const r = 5 + Math.sin(classTime * 0.4) * 1.5;
      ctx.strokeStyle = '#ce93d8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(s.x), Math.round(s.y), r, 0, 7); ctx.stroke();
      ctx.fillStyle = '#f3e5f5'; ctx.font = 'bold 6px monospace'; ctx.textAlign = 'center'; ctx.fillText('OM', Math.round(s.x), Math.round(s.y) + 2); ctx.textAlign = 'left';
      return;
    }
    if (s.kind === 'cup') {                        // a soda cup, lid and all
      ctx.save(); ctx.translate(Math.round(s.x), Math.round(s.y)); ctx.rotate(Math.round(s.spin / (Math.PI / 2)) * (Math.PI / 2));
      ctx.fillStyle = '#e53935'; ctx.fillRect(-3, -4, 6, 9); ctx.fillStyle = '#fff'; ctx.fillRect(-4, -5, 8, 2); ctx.fillRect(-2, -1, 4, 2);
      ctx.fillStyle = '#eceff1'; ctx.fillRect(0, -9, 1, 4);
      ctx.restore(); return;
    }
    if (s.kind === 'burger') {                     // a tumbling burger, flipping a quarter turn at a time
      ctx.save(); ctx.translate(Math.round(s.x), Math.round(s.y));
      ctx.rotate(Math.round(s.spin / (Math.PI / 2)) * (Math.PI / 2));
      ctx.fillStyle = '#ff9800'; ctx.fillRect(-6, -6, 12, 4); ctx.fillRect(-6, 3, 12, 3);
      ctx.fillStyle = '#ffd180'; ctx.fillRect(-4, -6, 2, 1); ctx.fillRect(1, -5, 2, 1);
      ctx.fillStyle = '#8bc34a'; ctx.fillRect(-7, -2, 14, 1);
      ctx.fillStyle = '#5d4037'; ctx.fillRect(-6, -1, 12, 3);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(-5, 2, 10, 1);
      ctx.restore();
      return;
    }
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin);
    ctx.fillStyle = '#e91e63'; ctx.fillRect(-5, -5, 10, 10);
    ctx.fillStyle = '#ff8ab3'; ctx.fillRect(-5, -5, 4, 4);
    ctx.restore();
  });

  parts.forEach(p => {
    if (p.ring) {
      ctx.globalAlpha = clamp(p.life / 16, 0, 1) * 0.8;
      ctx.strokeStyle = p.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.45, 0, 0, 7); ctx.stroke();
    } else if (p.star) {                                   // hard-edged 4-point flash
      const r = p.r * (p.life > 3 ? 1 : 0.6), x = Math.round(p.x), y = Math.round(p.y);
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff';
      ctx.fillRect(x - r, y - 1, r * 2, 2); ctx.fillRect(x - 1, y - r * 0.7, 2, r * 1.4);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 3, y - 3, 6, 6);
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 2, 4, 4);
    } else if (p.streak) {
      ctx.globalAlpha = clamp(p.life / 8, 0, 1);
      ctx.strokeStyle = p.col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(Math.round(p.x), Math.round(p.y));
      ctx.lineTo(Math.round(p.x - p.vx * 2.2), Math.round(p.y - p.vy * 2.2)); ctx.stroke();
    } else if (p.puff) {
      ctx.globalAlpha = clamp(p.life / 26, 0, 1) * 0.55;
      ctx.fillStyle = p.col; const z = Math.round(p.s);
      ctx.fillRect(Math.round(p.x) - z, Math.round(p.y) - z, z * 2, z * 2);
    } else {
      ctx.globalAlpha = clamp(p.life / 18, 0, 1);
      ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s, p.y - p.s, p.s * 2, p.s * 2);
    }
  });
  ctx.globalAlpha = 1;

  floats.forEach(f => {
    ctx.globalAlpha = clamp(f.life / 20, 0, 1);
    ctx.font = 'bold ' + (f.big ? 13 : 10) + 'px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(f.txt, f.x + 1, f.y + 1);
    ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y);
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();

  if (flashScreen > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (flashScreen / 24 * (SET.flash ? 1 : 0.2)) + ')';
    ctx.fillRect(0, 0, LW, LH);
  }

  if (focus && slowMo > 6) {                       // cinematic bars + callout
    const k = Math.min(1, (84 - slowMo) / 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, LW, 26 * k); ctx.fillRect(0, LH - 26 * k, LW, 26 * k);
    ctx.textAlign = 'center'; ctx.font = 'bold 22px monospace';
    const txt = focus.fin || ROUNDS[round].ko || 'ROUND CLEAR';
    ctx.fillStyle = '#000'; ctx.fillText(txt, LW / 2 + 2, LH - 34 + 2);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(txt, LW / 2, LH - 34);
    ctx.textAlign = 'left';
  } else {
    if (player.furyT > 0) {                          // fury: the edges of the screen burn
      const k = 0.18 + Math.sin(classTime * 0.2) * 0.06;
      const g = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.45, LW / 2, LH / 2, LW * 0.62);
      g.addColorStop(0, 'rgba(255,40,0,0)'); g.addColorStop(1, 'rgba(255,40,0,' + k + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
    }
    if (state !== 'scene') { drawChargeBar(); drawHUD(); drawBossBar(); }
    if (worldEv) drawWorldEvent();
    if (banner) drawBanner();
  }
  if (state === 'clear' && clear) drawClear();
  if (state === 'stage') drawStageCard();
  if (state === 'door' && door) drawDoor();
  if (state === 'scene' && scene) drawScene();
  if (state === 'credits' && credits) drawCredits();
  if (state === 'select') drawSelect();
  if (state === 'loot' && lootCard) drawLootCard();
  if (state === 'over') drawEnd(endlessMode ? 'WAVE ' + (round + 1) : 'CLASS DISMISSED', endlessMode ? 'that is as far as you got. this time.' : 'folded by your own clients', '#ff5252');
  if (state === 'win') drawEnd('SESSION COMPLETE', 'same time next week?', '#8bc34a');
  if (introCard && state === 'play' && !introCard.full) drawIntroMini();
  if (introCard && state === 'intro') drawIntro();
  if (state === 'levelup' && lvlCard) drawLevelUp();
  if (tutorial && state === 'play') drawTutorial();
  if (ticker && state === 'play') { if (++ticker.t > 210) ticker = null; else drawTicker(); }
  if (paused) drawPause();
  if (menu) drawMenu();
}

function drawBossBar() {
  const b = enemies.find(e => e.t.boss && !e.dead);
  if (!b) return;
  const w = 300, x = (LW - w) / 2, y = LH - 13;
  const k = clamp(b.hp / b.maxhp, 0, 1);
  ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(x - 3, y - 11, w + 6, 20);
  ctx.font = 'bold 7px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = b.phase === 3 ? '#ff5252' : '#ffd23f';
  ctx.fillText(b.t.label + (b.phase === 3 ? '  - ENRAGED' : ''), x, y - 3);
  ctx.fillStyle = '#3a3a4a'; ctx.fillRect(x, y, w, 6);
  ctx.fillStyle = b.phase === 3 ? '#ff3b3b' : b.phase === 2 ? '#ff9800' : '#e91e63';
  ctx.fillRect(x, y, w * k, 6);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x, y, w * k, 2);
  ctx.fillStyle = '#000';                                  // phase marks
  ctx.fillRect(x + w * 0.6, y, 1, 6); ctx.fillRect(x + w * 0.28, y, 1, 6);
  const need = b.t.breakNeed || 3;                         // how close you are to breaking his pattern
  ctx.textAlign = 'right'; ctx.font = 'bold 6px monospace';
  if (b.brokenT > 0) { ctx.fillStyle = (classTime >> 3) % 2 ? '#9fd0ff' : '#fff'; ctx.fillText('BROKEN!', x + w, y - 3); }
  else {
    ctx.fillStyle = '#6b6388'; ctx.fillText('BREAK', x + w - need * 8 - 2, y - 3);
    for (let i = 0; i < need; i++) { ctx.fillStyle = i < (b.pips || 0) ? '#9fd0ff' : '#3a3150'; ctx.fillRect(x + w - (need - i) * 8 + 1, y - 9, 6, 6); }
  }
  ctx.textAlign = 'left';
}

function drawIntroMini() {
  const c = introCard, t = TYPES[c.type];
  const k = Math.min(1, c.t / 10, (240 - c.t) / 12);
  const x = LW - 172 + (1 - k) * 180, y = 100;
  ctx.fillStyle = 'rgba(10,8,20,.82)'; ctx.fillRect(x, y, 166, 52);
  ctx.fillStyle = t.boss ? '#ff5252' : t.elite ? '#c79bff' : '#ffd23f'; ctx.fillRect(x, y, 166, 2);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y + 2, 40, 50); ctx.clip();
  if (!drawCharFrame(t.spr, 'idle' + ((c.t / 20 | 0) % 2), x + 20, y + 50, 1, null, 0, null)) drawRaw(SPR[t.spr], x + 20, y + 50, 1, 1, 1, null);
  ctx.restore();
  ctx.textAlign = 'left';
  ctx.font = 'bold 6px monospace'; ctx.fillStyle = t.boss ? '#ff5252' : t.elite ? '#c79bff' : '#ffd23f';
  ctx.fillText(t.boss ? 'BOSS' : t.elite ? 'ELITE MEMBER' : 'NEW CLIENT', x + 44, y + 11);
  ctx.font = 'bold ' + (t.label.length > 14 ? 8 : 10) + 'px monospace'; ctx.fillStyle = '#fff'; ctx.fillText(t.label, x + 44, y + 23);
  const mv = new Set(); t.near.concat(t.far).forEach(q => q.forEach(n => mv.add(n)));
  let yy = y + 33;
  ctx.font = 'bold 6px monospace';
  [...mv].filter(n => EMOVES[n].label).slice(0, 2).forEach(n => {

/* ============================== BOOT ============================== */
function fit() {
  const wrap = document.getElementById('wrap');
  const cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.min(aw / LW, ah / LH);
  // pixel art scaled by a fraction gets uneven pixels, and anything that moves seems to wobble.
  // Use a whole-number scale whenever that gives up less than a fifth of the space.
  if (s >= 2 && (s - Math.floor(s)) / s < 0.2) s = Math.floor(s);
  else if (s >= 1) s = Math.floor(s * 8) / 8;
  s = Math.max(0.15, s);
  cv.style.width = Math.floor(LW * s) + 'px';
  cv.style.height = Math.floor(LH * s) + 'px';
}

function boot() {
  cv.width = LW; cv.height = LH;
  ctx.imageSmoothingEnabled = false;
  initBlood(); initDebris();
  sliceFrameSets();
  setupTouch(); fit();
  document.addEventListener('visibilitychange', () => {        // switched away: pause and go quiet
    if (document.hidden) { if (state === 'play' && !paused) togglePause(); try { A.ctx && A.ctx.suspend(); } catch (e) {} }
    else { try { A.ctx && A.ctx.resume(); } catch (e) {} }
  });
  // the Android app calls these: when it goes to the background, and when Back is pressed
  window.lcAppPause = () => { if (state === 'play' && !paused) togglePause(); try { A.ctx && A.ctx.suspend(); } catch (e) {} };
  window.lcAppResume = () => { try { A.ctx && A.ctx.resume(); } catch (e) {} };
  window.lcAppBack = () => {
    if (menu) { closeMenu(); return true; }
    if (state === 'levelup' && lvlCard) { closeTree(); return true; }
    if (paused) { togglePause(); return true; }
    if (state === 'play') { togglePause(); return true; }
    if (state !== 'title') { state = 'title'; stateT = 0; M.play('title'); return true; }
    return false;
  };
  addEventListener('gamepadconnected', () => { GP.active = true; });
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => { fit(); setTimeout(fit, 250); });
  setTimeout(fit, 120);
  player = makePlayer(); enemies = []; pickups = []; shots = []; parts = []; floats = [];
  layoutProps();
  const l = document.getElementById('loading'); if (l) l.style.display = 'none';
  let last = performance.now(), acc = 0;
  frozen = false;
  const STEP = 1000 / 60;
  (function loop(now) {
    acc += Math.min(now - last, 100); last = now;
    while (acc >= STEP) { pollPad(); if (!frozen) update(); acc -= STEP; }
    ctx.clearRect(0, 0, LW, LH);
    ctx.imageSmoothingEnabled = false;
    render();
    requestAnimationFrame(loop);
  })(performance.now());

  window.__LC = {
    info: () => ({ shots: shots.length, state, round, score, slowMo, paused, combo, enemies: enemies.length, queue: spawnQ.length,
                   hp: Math.round(player.hp), stam: Math.round(player.stam), st: player.st }),
    kill: () => enemies.forEach(e => { if (!e.dead) { e.hp = 0; killEnemy(e); } }),
    god: v => { player.god = v; },
    mute: () => { A.on = false; M.stop(); cardsOff = true; Object.keys(TYPES).forEach(t => seen.add(t)); },   // test mode: silent, no name cards
    intros: v => { cardsOff = !v; if (v) seen.clear(); else Object.keys(TYPES).forEach(t => seen.add(t)); },
    card: () => introCard ? { type: introCard.type, full: introCard.full, state } : { state },
    intro: () => introCard ? introCard.type : null,
    flow: () => ({ state, paused, slowMo, round, grades: grades.slice(), clear: clear ? clear.g : null,
                   best, music: M.cur, musicOn: M.on, gore }),
    pause: () => togglePause(),
    freeze: v => { frozen = v; },
    fury: v => { player.fury = v; if (v >= 100) enterFury(player); },
    stagger: () => { const e = enemies.find(z => !z.dead); if (e) { e.setState('stagger', 200); } },
    limbs: () => enemies.filter(z => !z.dead).map(z => ({ t: z.type, hp: Math.round(z.hp), max: z.maxhp, ld: z.limbDmg, miss: [...z.missing], st: z.st })),
    ff: () => ({ st: player.st, fury: Math.round(player.fury), furyT: player.furyT, lunge: !!player.lunge, fin: !!player.fin,
                 mv: player.move && player.st === 'attack' ? player.move.name : null, x: Math.round(player.x), slowMo, focus: focus && focus.fin }),
    cls: () => ({ state, cls: CLS, sel: CLASS_KEYS[selIdx], gear: Object.assign({}, gear), loot: loot.map(l => l.id), card: lootCard ? lootCard.l.id : null,
                  maxhp: player.maxhp, hp: Math.round(player.hp), skin: !!FS.pskin }),
    setClass: k => { CLS = k; const hp = player.hp; applyClass(player); buildSkin(); },
    grant: (...ids) => ids.forEach(id => { gear[ITEMS[id].slot] = id; }),
    drop: (id, x, y) => { seenLoot.add(id); loot.push({ id, x, y, t: 31, vz: 0, z: 0 }); },
    equip: id => equip(id),
    hurt: n => { player.hp -= n; },
    foeHP: n => enemies.forEach(e => { e.hp = e.maxhp = n; }),
    step: n => { for (let i = 0; i < (n || 1); i++) update(); ctx.clearRect(0, 0, LW, LH); render(); },
    hold: (k, v) => { if (v) press(k); else keys[k] = false; },
    frame: () => ({ p: playerFrame(player), e: enemies.filter(z => !z.dead).map(z => enemyFrame(z)) }),
    toRound: n => { flowOff = false; round = n; enemies.length = 0; spawnQ.length = 0; ticker = null; state = 'play'; clear = null; slowMo = 0; focus = null; M.muffle(false); startRound(); },
    gore: v => { gore = v; },
    tut: () => tutorial ? { i: tutorial.i, say: tutorial.i >= 0 && TUT[tutorial.i] ? TUT[tutorial.i].say : null, wait: tutorial.wait, done: tutorial.done || 0 } : null,
    tutSkip: () => { if (tutorial && tutorial.i >= 0) { tutorial.wait = 1; } },
    hurtMe: () => { player.hp = 0; },
    hitBoss: n => enemies.forEach(e => { if (e.t.boss) e.hp -= n; }),
    wreck: n => { if (n != null) wreckAdd(n); return { lvl: WRK && WRK.lvl, collapsed: WRK && WRK.collapsed, room: curRoom(), decor: decor.filter(d => !d.fallen).length, chunks: chunks.length, state }; },
    bossTo: k => { const e = enemies.find(e => e.t.boss && !e.dead); if (!e) return null; if (k != null) e.hp = Math.max(1, Math.round(e.maxhp * k)); return [e.hp, e.maxhp, e.phase]; },
    killBoss: () => { const e = enemies.find(e => e.t.boss && !e.dead); if (e) { e.hp = 0; killEnemy(e); } },
    line: () => scene ? scene.lines[scene.i].s : null,
    evNow: () => { evAt = classTime + 1; return evKey(); },
    prog: v => { forceProg = !!v; },
    skills: () => ({ level, xp, need: xpNeed(level), learned: [...learned], passives, pending: pendingPicks, state, ng: ngPlus, sel: lvlCard && curTree()[lvlCard.sel][0] }),
    openTree: () => openTree(),
    pip: () => { const e = enemies.find(e => e.t.boss && !e.dead); if (!e) return null; e.pipAt = -999; bossPip(e, 'TEST'); return { pips: e.pips || 0, broken: e.brokenT || 0, st: e.st }; },
    parryTest: big => { const e = enemies.find(e => !e.dead && !e.t.boss && !e.crowd); if (!e) return null; const p = player;
      p.setState('block'); p.blocking = true; p.blockT = 1; p.iframes = 0; p.airY = 0;
      const g = p.god; p.god = false; p.hp = p.maxhp; const r = hitPlayer(e, big ? { kind: 'white', dmg: 14, name: 'test' } : { kind: 'white', dmg: 7, name: 'test' }); p.god = g; return { r, st: e.st }; },
    grant: (...ids) => ids.forEach(id => learnNode(id)),
    xpAdd: n => gainXP(n),
    ngplus: v => { ngPlus = !!v; if (v) saveJSON('lastclass.ngplus', 1); },
    raid: () => raid ? { t: raid.t, heli: raid.heli, police: enemies.filter(e => e.t.police && !e.dead).map(e => e.type + (e.leaving ? ':leaving' : '')), done: raidDone } : { none: true, done: raidDone },
    story: v => { forceStory = !!v; },
    cut: () => ({ state, i: scene ? scene.i : -1, n: scene ? scene.lines.length : 0, hot: hotYoga, wife: wifeOn, credits: !!credits }),
    endless: () => ({ on: endlessMode, round, len: ROUNDS.length, best: endlessBest, name: ROUNDS[round] && ROUNDS[round].name, stage: stageOf(round) }),
    menuState: () => ({ state, menu: menu ? menu.kind : null, sel: menu ? menu.sel : null, titleSel, items: titleItems(), set: Object.assign({}, SET), pad: GP.active, cp: checkpoint() }),
    padTest: (k, down) => { GP.active = true; if (down) keyDown(k, false); else keyUp(k); },
    props: () => props.map(o => ({ t: o.type, x: Math.round(o.x), y: Math.round(o.y),
                                   z: Math.round(o.z), vx: +o.vx.toFixed(2), hp: o.hp })),
    putProp: (i, x, y) => { if (props[i]) { props[i].x = x; props[i].y = y; } },
    foes: () => enemies.map(e => ({ t: e.type, st: e.st, mv: e.moveName || null,
                                    cool: Math.round(e.cool), q: e.queue.length, f: e.f,
                                    missing: e.missing ? [...e.missing] : [], hop: !!e.hop, crawl: !!e.crawl,
                                    kind: e.move ? e.move.kind : null, hp: Math.round(e.hp),
                                    tok: !!e.hasToken, x: Math.round(e.x), y: Math.round(e.y) })),
    event: () => { if (!worldEv) evAt = classTime; },
    stagger: () => enemies.forEach(e => { if (!e.dead) e.setState('stagger', 80); }),
    downFoe: i => { const e = enemies.filter(z => !z.dead)[i || 0]; if (e) { e.setState('down', 200); e.hp = Math.min(e.hp, e.maxhp * 0.5); } },
    shotKinds: () => shots.map(s => s.kind),
    weapon: () => player.weapon ? Object.assign({}, player.weapon) : null,
    giveWeapon: t => { player.weapon = { t, uses: WEAPONS[t].uses }; },
    styleInfo: () => ({ pts: Math.round(style.pts), rank: STYLE_RANKS[styleRank()].l }),
    witch: () => witchT,
    killFighters: () => enemies.forEach(e => { if (!e.crowd && !e.dead) { e.hp = 0; killEnemy(e); } }),
    killCrowd: () => enemies.forEach(e => { if (e.crowd && !e.dead && e.x > WALL_L && e.x < WALL_R) { e.hp = 0; killEnemy(e); } }),
    ev: () => worldEv && { need: worldEv.need, phase: worldEv.phase, ko: worldEv.ko, total: worldEv.total, through: worldEv.through, wave: worldEv.wave },
    only: type => { flowOff = true; enemies.length = 0; spawnQ.length = 0; spawnEnemy(type); },
    spawn: type => spawnEnemy(type),
    dumpStuck: () => ({ p: [Math.round(player.x), Math.round(player.y), player.st], foes: enemies.filter(e => !e.dead).map(e => ({ t: e.type, x: Math.round(e.x), y: Math.round(e.y), st: e.st, tok: e.hasToken, cool: e.cool, q: e.queue, slot: e.slot, f: e.f })),
                         props: props.filter(o => !o.gone && o.solid).map(o => o.type + '@' + Math.round(o.x) + ',' + Math.round(o.y)), spawnQ: spawnQ.slice(), tokens: attackToken }),

    vib: () => { const p = player; return { x: +p.x.toFixed(2), y: +p.y.toFixed(2), vx: +p.vx.toFixed(2), face: p.face, st: p.st, fr: playerFrame(p),
                 vibe: p.vibeUntil > stateT, shake: +shake.toFixed(2), cam: +camKX.toFixed(2), ifr: p.iframes, turnT: p.turnT || 0, skidT: p.skidT || 0 }; },
    scene: () => ({ props: props.filter(o => !o.gone).map(o => o.type + ':' + o.hp), puddles: puddles.map(q => q.kind), panes: scenePanes().map(p => p.dmg), cracks: wallCracks.length }),
    propAt: t => { const o = props.find(z => !z.gone && z.type === t); return o ? { x: o.x, y: o.y } : null; },
    quake: (x, n) => quake(x, n),
    woundLeg: () => { const e = enemies.find(z => !z.dead); if (e) e.limbDmg.legN = limbCap(e) * 0.8; },
    guardUp: () => { const e = enemies.find(z => !z.dead); if (e) { e.face = sgn(player.x - e.x); e.setState('eblock', 200); } },
    evx: () => enemies.filter(z => !z.dead).map(z => +z.vx.toFixed(1)),
    putFoeN: (i, x, y) => { const e = enemies.filter(z => !z.dead)[i]; if (e) { e.x = x; e.y = y; e.setState('idle'); e.vx = 0; } },
    perch: t => { const o = props.find(z => !z.gone && z.type === t); if (!o) return false; player.x = o.x; player.y = o.y; player.baseZ = o.h; player.airY = 0; player.airV = 0; player.under = o; player.setState('idle'); return true; },
    perchFoe: (t, i) => { const o = props.find(z => !z.gone && z.type === t), e = enemies.filter(z => !z.dead)[i || 0]; if (!o || !e) return false; e.x = o.x; e.y = o.y; e.baseZ = o.h; e.under = o; return true; },
    eclimb: () => enemies.filter(e => !e.dead).map(e => ({ t: e.type, st: e.st, z: e.baseZ || 0, x: Math.round(e.x), y: Math.round(e.y) })),
    waveInfo: () => ({ round, state, queue: spawnQ.length, alive: enemies.filter(e => !e.dead && !e.crowd).length, ticker: !!ticker, intro: !!introCard }),
    pk: () => ({ st: player.st, x: Math.round(player.x), y: Math.round(player.y), baseZ: player.baseZ, airY: +player.airY.toFixed(1),
                 under: player.under ? player.under.type : null, flip: player.flipT, face: player.face }),
    pstate: () => ({ charge: +(player.charge || 0).toFixed(2), face: player.face, mvName: player.move && player.st === 'attack' ? player.move.name : null, chargedHit: player.move && player.move.charged || 0, st: player.st, chain: player.chain, blocking: player.blocking,
                     blockT: player.blockT, ifr: player.iframes, stam: Math.round(player.stam),
                     sup: Math.round(player.super), x: Math.round(player.x), y: Math.round(player.y),
                     airY: Math.round(player.airY), airV: +player.airV.toFixed(1),
                     acts: player.airActs, mv: player.move ? player.move.name : null }),
    put: (x, y) => { player.x = x; player.y = y; },
    carry: () => player.carry ? player.carry.kind : null,
    sever: (limb, kill) => { const e = enemies.find(z => !z.dead); if (!e) return false;
                             if (kill) e.hp = 0; sever(e, limb, player.face, !!kill); if (kill) killEnemy(e); return true; },
    putFoe: (x, y) => { if (enemies[0]) { enemies[0].x = x; enemies[0].y = y;
                        if (enemies[0].st === 'enter') enemies[0].setState('idle'); } },
    log: () => EVLOG.slice(),
    dmg: () => dmgTaken,
    clearLog: () => { EVLOG.length = 0; },
    sup: () => { player.super = player.maxsuper; }
  };
}
})();

</script>
