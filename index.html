<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Last Class</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#14101f;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  body.touch #wrap{align-items:center;
    padding:calc(6px + env(safe-area-inset-top)) 6px calc(188px + env(safe-area-inset-bottom)) 6px}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.6);border-radius:2px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#ffd23f;font-weight:700;letter-spacing:.2em;font-size:13px}
  #pad{position:fixed;inset:0;pointer-events:none;display:none}
  body.touch #pad{display:block}
  /* phones play sideways: the canvas takes the full height, the two pads sit on either side */
  body.touch #wrap{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stick,#apad{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));
    width:124px;height:124px;border-radius:50%;pointer-events:auto;
    background:rgba(20,16,31,.35);border:2px solid rgba(255,255,255,.18)}
  #stick{left:calc(12px + env(safe-area-inset-left))}
  #apad{right:calc(12px + env(safe-area-inset-right));
    background:conic-gradient(rgba(255,210,63,.55) var(--c,0deg), rgba(20,16,31,.35) 0)}
  #knob,#aknob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;
    transform:translate(-50%,-50%);transition:transform .04s linear;pointer-events:none}
  #knob{background:rgba(255,210,63,.5);border:2px solid rgba(255,255,255,.5)}
  #aknob{background:rgba(255,107,53,.6);border:2px solid rgba(255,255,255,.55)}
  #apad.charging #aknob{background:rgba(255,210,63,.85)}
  /* little labels round the action pad: what each swipe does */
  .lab{position:absolute;color:rgba(255,255,255,.55);font-size:9px;font-weight:800;letter-spacing:.04em;pointer-events:none}
  .lab.u{top:6px;left:50%;transform:translateX(-50%)}
  .lab.d{bottom:6px;left:50%;transform:translateX(-50%)}
  .lab.l{left:7px;top:50%;transform:translateY(-50%)}
  .lab.r{right:7px;top:50%;transform:translateY(-50%)}
  .lab.c{left:50%;top:50%;transform:translate(-50%,-50%);color:rgba(27,22,48,.75);font-size:8px}
  #apad.fu .lab.u,#apad.fd .lab.d,#apad.fl .lab.l,#apad.fr .lab.r{color:#ffd23f}
  #apad.fh #aknob{transform:translate(-50%,-50%) scale(.85)}
  .btn{position:absolute;border-radius:50%;pointer-events:auto;display:flex;
    align-items:center;justify-content:center;font-weight:800;color:#1b1630;
    letter-spacing:.03em;border:3px solid rgba(0,0,0,.3);text-align:center;line-height:1.05;opacity:.85}
  .btn.on{transform:scale(.92);filter:brightness(1.3);opacity:1}
  #bBlock  {width:58px;height:58px;right:calc(146px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
            background:#6d8fb8;color:#fff;font-size:9px}
  #bWhistle{width:44px;height:44px;right:calc(150px + env(safe-area-inset-right));bottom:calc(82px + env(safe-area-inset-bottom));
            background:#ffd23f;font-size:7px}
  #bPause  {width:36px;height:36px;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));border-radius:8px;
            background:rgba(255,255,255,.18);color:#fff;font-size:12px;border-color:rgba(0,0,0,.4)}
  /* held upright: ask to turn the phone */
  #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:#14101f;color:#ffd23f;font-weight:800;letter-spacing:.12em;font-size:14px;text-align:center}
  #rotate small{color:#b8aed0;font-size:10px;letter-spacing:.06em;font-weight:600}
  #rotate .ph{width:46px;height:80px;border:4px solid #ffd23f;border-radius:9px;position:relative;animation:turn 1.8s ease-in-out infinite}
  #rotate .ph:after{content:'';position:absolute;left:50%;bottom:5px;width:10px;height:3px;margin-left:-5px;background:#ffd23f;border-radius:2px}
  @keyframes turn{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rotate{display:flex} body.touch #pad{display:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div id="apad"><span class="lab u">JUMP</span><span class="lab d">GRAB</span><span class="lab l">HIT</span><span class="lab r">HIT</span><div id="aknob"><span class="lab c">HOLD</span></div></div>
  <div class="btn" id="bBlock">BLOCK</div>
  <div class="btn" id="bWhistle">WHSTL</div>
  <div class="btn" id="bPause">II</div>
</div>
<div id="rotate"><div class="ph"></div>TURN YOUR PHONE SIDEWAYS<small>Last Class plays in landscape</small></div>
<div id="loading">WARMING UP…</div>

const keys = {}, buf = {};
const menuQ = [];                         // menu screens read whole key presses from here
const BUF = 15;   // ~250ms: a press during active frames survives into the cancel window
function press(k) { keys[k] = true; buf[k] = BUF; }
function tickBuf() { for (const k in buf) if (buf[k] > 0) buf[k]--; }

function tapped(k) { return keys[k] || buf[k] > 0; }
function eat(ks) { ks.forEach(k => buf[k] = 0); }

function keyDown(k, rep) {
  A.init(); A.resume();
  if (rep) { keys[k] = true; return; }
  if (menu) { keys[k] = true; menuKey(k); return; }          // settings / controls screens
  // menu keys act straight away rather than through the move buffer
  if (k === 'm') M.toggle();
  if (k === 'b') toggleGore();
  if (state === 'levelup' && (k === 'p' || k === 'escape')) { menuQ.push('k'); return; }
  if (k === 't' && state === 'play' && !paused) treeReq = true;
  if (k === 'p' || k === 'escape') togglePause();
  if (paused) { pauseKey(k); return; }
  menuQ.push(k);
  press(k);
  if (k === ' ') press('space');
}
function keyUp(k) {
  keys[k] = false;
  if (k === ' ') keys['space'] = false;
}

  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();

/* ---------- controllers (Xbox / PlayStation / Steam Deck: the standard layout) ----------
   stick or d-pad move   A jump   X light   Y heavy   B grab / throw / cutter
   RB or RT block (plus a direction = dodge)   LB whistle   START pause   */
const GP = { dx: 0, dy: 0, prev: {}, active: false, menuDir: null, menuT: 0 };
const GP_MAP = { 0: ' ', 1: 'l', 2: 'j', 3: 'k', 4: 'u', 5: 'h', 6: 'u', 7: 'shift', 8: 'escape', 9: 'p',
                 12: 'arrowup', 13: 'arrowdown', 14: 'arrowleft', 15: 'arrowright' };
const PAD_LABEL = { ' ': 'A', space: 'A', j: 'X', k: 'Y', l: 'B', h: 'RB', u: 'LB', p: 'START', enter: 'A' };
const btn = k => GP.active ? (PAD_LABEL[k] || k.toUpperCase()) : (k === ' ' || k === 'space' ? 'SPACE' : k.toUpperCase());
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const q of pads) if (q && q.connected) { gp = q; break; }
  if (!gp) { GP.dx = GP.dy = 0; return; }
  for (const i in GP_MAP) {
    const b = gp.buttons[i], down = !!b && (b.pressed || b.value > 0.5);
    if (down && !GP.prev[i]) { GP.active = true; keyDown(GP_MAP[i], false); }
    if (!down && GP.prev[i]) keyUp(GP_MAP[i]);
    GP.prev[i] = down;
  }
  let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (Math.hypot(x, y) < 0.25) { x = 0; y = 0; } else GP.active = true;
  GP.dx = x; GP.dy = y;
  // in menus the stick steps like the arrow keys
  const dir = Math.abs(x) > Math.abs(y) ? (x > 0.6 ? 'arrowright' : x < -0.6 ? 'arrowleft' : null)
                                        : (y > 0.6 ? 'arrowdown' : y < -0.6 ? 'arrowup' : null);
  if (GP.menuT > 0) GP.menuT--;
  if (dir && (state !== 'play' || paused || menu) && (dir !== GP.menuDir || GP.menuT <= 0)) {
    keyDown(dir, false); keyUp(dir); GP.menuT = dir !== GP.menuDir ? 18 : 8;
  }
  GP.menuDir = dir;
}

const T = { dx: 0, dy: 0, light: false, heavy: false, dodge: false, whistle: false,
            jump: false, block: false,
            charging: false, chargeRelease: false, flickFace: 0, flickFaceT: 0,
            lightEdge: false, heavyEdge: false, dodgeEdge: false, whistleEdge: false,
            jumpEdge: false, blockEdge: false };

function setupTouch() {
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null, cx = 0, cy = 0; const R = 46;
  const start = e => {
    e.preventDefault(); A.init(); A.resume();
    const t = e.changedTouches[0]; id = t.identifier;
    const r = stick.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2; mv(t);
  };
  const move = e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === id) mv(t); };
  const end = e => { for (const t of e.changedTouches) if (t.identifier === id) {
      id = null; T.dx = 0; T.dy = 0; knob.style.transform = 'translate(-50%,-50%)'; } };
  stick.addEventListener('touchstart', start, { passive: false });
  stick.addEventListener('touchmove', move, { passive: false });
  stick.addEventListener('touchend', end); stick.addEventListener('touchcancel', end);
  function mv(t) {
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const d = Math.hypot(dx, dy) || 1, cl = Math.min(d, R);
    dx /= d; dy /= d;
    knob.style.transform = `translate(calc(-50% + ${dx * cl}px), calc(-50% + ${dy * cl}px))`;
    const mag = Math.min(1, d / R);
    T.dx = mag < 0.22 ? 0 : dx * mag;
    T.dy = mag < 0.22 ? 0 : dy * mag;
  }
  const bind = (el, p) => {
    if (!el) return;
    const dn = e => { e.preventDefault(); A.init(); A.resume(); T[p] = true; T[p + 'Edge'] = true; el.classList.add('on'); };
    const up = e => { if (e.cancelable) e.preventDefault(); T[p] = false; el.classList.remove('on'); };
    el.addEventListener('touchstart', dn, { passive: false });
    el.addEventListener('touchend', up); el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', dn); el.addEventListener('mouseup', up);
  };
  bind(document.getElementById('bBlock'), 'block');
  bind(document.getElementById('bWhistle'), 'whistle');
  setupActionPad();
  const bp = document.getElementById('bPause');
  if (bp) {
    const tp = e => { e.preventDefault(); A.init(); A.resume(); togglePause(); };
    bp.addEventListener('touchstart', tp, { passive: false });
    bp.addEventListener('mousedown', tp);
  }
}
/* ---------- the action pad: a second stick, worked with swipes ----------
   swipe left / right  light attack that way (swipe again for the combo)
   swipe up            jump
   swipe down          grab / throw  (in the air: cutter onto someone below, or a dive slam)
   tap                 heavy
   hold still          charge the heavy; let go to swing it
   Swipes go through the same 15-frame input buffer as the keyboard, so a
   swipe made during an attack still comes out in the cancel window. */
const FLICK_PX = 20, FLICK_MS = 230, HOLD_MS = 150, REARM_PX = 13;
function setupActionPad() {
  const pad = document.getElementById('apad'), knob = document.getElementById('aknob');
  if (!pad) return;
  let id = null, cx = 0, cy = 0, t0 = 0, armed = true, fired = false, holdTimer = null;
  const R = 50;
  const show = (dx, dy) => {
    const d = Math.hypot(dx, dy) || 1, cl = Math.min(d, R);
    knob.style.transform = `translate(calc(-50% + ${dx / d * cl}px), calc(-50% + ${dy / d * cl}px))`;
  };
  const flash = cls => { pad.classList.add(cls); setTimeout(() => pad.classList.remove(cls), 120); };
  const stopCharge = () => { clearTimeout(holdTimer); holdTimer = null; T.charging = false; };
  const flick = (dx, dy) => {
    stopCharge();
    if (Math.abs(dx) >= Math.abs(dy)) {                    // sideways: punch that way
      T.flickFace = sgn(dx); T.flickFaceT = BUF;
      buf.j = BUF; flash(dx < 0 ? 'fl' : 'fr');
    } else if (dy < 0) { buf.space = BUF; flash('fu'); }   // up: jump
    else { buf.l = BUF; flash('fd'); }                     // down: grab - in the air: a cutter if someone's below, else a slam
    fired = true; armed = false;
  };
  const start = e => {
    e.preventDefault(); A.init(); A.resume(); goLandscape();
    const t = e.changedTouches[0]; id = t.identifier;
    const r = pad.getBoundingClientRect();
    cx = t.clientX; cy = t.clientY;                        // the gesture starts where the thumb lands
    pad.dataset.cx = r.left + r.width / 2;
    t0 = performance.now(); armed = true; fired = false;
    holdTimer = setTimeout(() => { if (!fired) { T.charging = true; pad.classList.add('charging'); } }, HOLD_MS);
  };
  const move = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      const dx = t.clientX - cx, dy = t.clientY - cy, d = Math.hypot(dx, dy);
      show(dx, dy);
      if (!armed && d < REARM_PX) { armed = true; t0 = performance.now(); }   // back to centre: ready again
      if (armed && d > FLICK_PX && (performance.now() - t0 < FLICK_MS || T.charging)) flick(dx, dy);
    }
  };
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      id = null;
      knob.style.transform = 'translate(-50%,-50%)';
      pad.classList.remove('charging');
      if (T.charging) { T.chargeRelease = true; buf.k = BUF; flash('fh'); }       // let go: swing the charged heavy
      else if (!fired && performance.now() - t0 < HOLD_MS + 40) { buf.k = BUF; flash('fh'); }   // tap: heavy
      stopCharge();
    }
  };
  pad.addEventListener('touchstart', start, { passive: false });
  pad.addEventListener('touchmove', move, { passive: false });
  pad.addEventListener('touchend', end); pad.addEventListener('touchcancel', end);
}

    if (rq) { const r = rq.call(el); if (r && r.then) r.then(lock).catch(lock); else lock(); } else lock();

function clipFrame(name, t) {
  const c = CLIPS[name];
  return c.f[Math.floor(t / c.hold) % c.f.length];
}

function poseFor(a, isP) {
  const t = a.animT || 0;
  if (isP && a.carry && a.st !== 'attack') {
    const base = (a.st === 'walk' || a.st === 'run') ? clipFrame(a.st, t) : clipFrame('idle', t);
    return { legFront: base.legFront, legBack: base.legBack, torso: POSE.carry.torso,
             head: POSE.carry.head, armFront: POSE.carry.armFront, armBack: POSE.carry.armBack };
  }

  if (isP && a.airY > 0 && a.st !== 'attack') {
    return a.slamming ? POSE.slam : (a.airV > 0 ? POSE.riseAir : POSE.fallAir);
  }

  switch (a.st) {
    case 'walk': case 'enter': return clipFrame('walk', t);
    case 'run': return clipFrame('run', t);
    case 'block': return POSE.block;
    case 'blockstun': return POSE.blockstun;
    case 'hurt': return POSE.hurt;
    case 'land': return POSE.land;
    case 'gassed': return clipFrame('gassed', t);
    case 'stagger': return clipFrame('stagger', t);
    case 'air': case 'thrown': return clipFrame('juggled', t);
    case 'held': return POSE.hurt;
    case 'airborne': return a.slamming ? POSE.slam : (a.airV > 0 ? POSE.riseAir : POSE.fallAir);
    case 'dodge': return a.f > 11 ? POSE.dodgeTuck : POSE.dodgeOut;
    case 'getup': return a.f > 9 ? POSE.getupA : POSE.getupB;
    case 'rec': return POSE.eRecover;
    case 'act': {
      const k = a.move && a.move.act ? 1 - a.f / a.move.act : 1;
      return k < 0.3 ? POSE.swing : POSE.eStrike;
    }
    case 'tele': {
      const mv = a.move, k = mv.wind ? 1 - a.f / mv.wind : 1;
      if (k < 0.35) return POSE.teleA;
      if (k < 0.72) return POSE.teleB;
      return POSE.teleC;
    }
    case 'attack': {
      const mv = a.move, total = mv.wind + mv.act + mv.rec, e = total - a.f;
      const kick = mv.pose === 'kick';
      if (e < mv.wind) {
        if (kick) return POSE.kickWind;
        return (mv.wind >= 10 && e < mv.wind * 0.45) ? POSE.windA : POSE.windB;
      }
      if (e < mv.wind + mv.act) {
        const k = (e - mv.wind) / Math.max(1, mv.act);
        if (kick) return k < 0.4 ? POSE.kickSwing : POSE.kickHit;
        return k < 0.35 ? POSE.swing : POSE.strike;     // the arm swings through
      }
      return kick ? POSE.kickRec : POSE.recover;
    }
    default: return clipFrame('idle', t);
  }
}

function drawRigged(spr, rig, x, y, face, squash, stretch, mode, pose) {
  const S = SCALE, W = spr.w, H = spr.h;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (squash !== 1 || stretch !== 1) ctx.scale(face * stretch, squash);
  else ctx.scale(face, 1);
  for (let i = 0; i < rig.length; i++) {
    const p = rig[i], v = pose[p.n] || EMPTY;
    // snap: whole sprite pixels, 15-degree rotation steps
    const r = v[0] ? Math.round(v[0] / RQ) * RQ : 0;
    const ox = Math.round(v[1] || 0), oy = Math.round(v[2] || 0);
    ctx.save();
    ctx.translate((p.px - W / 2 + ox) * S, (-(H - p.py) + oy) * S);
    if (r) ctx.rotate(r);
    const im = mode === 'white' ? p.white : mode === 'red' ? p.red : p.img;
    ctx.drawImage(im, (p.x - p.px) * S, (p.y - p.py) * S, p.w * S, p.h * S);
    ctx.restore();
  }
  ctx.restore();
}

let gore = SET.gore !== false;
let bloodLayer = null, bloodCtx = null;

function initBlood() {
  bloodLayer = document.createElement('canvas');
  bloodLayer.width = LW; bloodLayer.height = LH;
  bloodCtx = bloodLayer.getContext('2d');
  bloodCtx.imageSmoothingEnabled = false;
}
function clearBlood() { if (bloodCtx) bloodCtx.clearRect(0, 0, LW, LH); }

const BLOOD_DARK = ['#8b0a14', '#a30d1a', '#6d0710'];
const BLOOD_LIVE = ['#e01e2a', '#ff2d2d', '#c1121f'];

// drops arc up, fall, and stain the floor where they land
function bloodSpray(x, y, groundY, n, dirX, power) {
  if (enemies && enemies.some(e => e.t && e.t.noGore && Math.abs(e.x - x) < 16 && Math.abs(e.y - groundY) < 8)) return;   // not on the kid
  if (!gore) return;
  const pw = power || 1;
  for (let i = 0; i < n; i++) {
    parts.push({
      blood: true, x, y,
      vx: (dirX || 0) * rnd(0.6, 2.4) * pw + rnd(-1.1, 1.1),
      vy: rnd(-2.8, -0.2) * pw, g: 0.22,
      gy: groundY + rnd(-3, 5),
      life: 90, col: pick(BLOOD_LIVE), s: rnd(0.8, 2)
    });
  }
}

function stainFloor(x, y, size) {
  if (!bloodCtx || !gore) return;
  bloodCtx.fillStyle = pick(BLOOD_DARK);
  const n = 1 + (Math.random() * size) | 0;
  for (let i = 0; i < n; i++) {
    const w = 1 + ((Math.random() * size) | 0), h = 1 + ((Math.random() * (size * 0.6)) | 0);
    bloodCtx.fillRect(Math.round(x + rnd(-size, size)), Math.round(y + rnd(-size * 0.5, size * 0.5)), w, h);
  }
}

function makeRagdoll(e, dirX) {
  const hard = Math.abs(dirX) > 0 ? 1 : 0.6;
  return {
    rot: 0,
    rotV: dirX * rnd(0.1, 0.26) + rnd(-0.06, 0.06),
    z: e.airY || 0,
    vz: 2.6 + Math.random() * 2.6,
    vx: dirX * rnd(1.8, 4.2) * hard,
    grounded: false,
    limbs: {
      head:     { a: 0, v: rnd(-0.2, 0.2) },
      armFront: { a: 0.5,  v: rnd(-0.5, 0.5) },
      armBack:  { a: -0.5, v: rnd(-0.5, 0.5) },
      legFront: { a: 0,    v: rnd(-0.4, 0.4) },
      legBack:  { a: 0,    v: rnd(-0.4, 0.4) }
    }
  };
}

const LIMB_HANG = { head: 0, armFront: 0.95, armBack: -0.95, legFront: 0.15, legBack: -0.15 };

function stepRagdoll(e) {
  const r = e.rag;
  if (!r) return;
  r.vz -= 0.42;
  r.z += r.vz;
  e.x += r.vx;
  r.vx *= 0.985;
  r.rot += r.rotV;

  if (r.z <= 0) {
    r.z = 0;
    if (r.vz < -1.3) {                       // bounce
      r.vz = -r.vz * 0.3;
      r.vx *= 0.5;
      r.rotV *= 0.45;
      burst(e.x, e.y, 5, '#c9a06a', 1.6);
      if (gore) { bloodSpray(e.x, e.y - 6, e.y, 4, sgn(r.vx), 0.7); stainFloor(e.x, e.y, 3); }
      A.land(false);
    } else {
      r.vz = 0; r.vx *= 0.76; r.grounded = true;
    }
  }
  props.forEach(o => {
    if (o.gone || o.heavy > 9) return;
    if (Math.abs(o.x - e.x) < o.w + 10 && Math.abs(o.y - e.y) < o.d + 8 && Math.abs(r.vx) > 0.8) {
      punt(o, r.vx * 1.4, 0, 1.2, 'body');
      r.vx *= 0.55;
    }
  });
  if (r.grounded) {
    r.rotV *= 0.8;
    const lie = r.rot < 0 ? -Math.PI / 2 : Math.PI / 2;   // settle onto its back
    r.rot += (lie - r.rot) * 0.12;
    if (gore && e.deadT % 14 === 0 && e.deadT < 90) stainFloor(e.x + rnd(-6, 6), e.y + rnd(-2, 2), 3);
  } else {
    r.rotV *= 0.995;
  }

  // limbs: damped pendulums that try to hang down in world space
  for (const k in r.limbs) {
    const L = r.limbs[k];
    const target = (LIMB_HANG[k] - r.rot * 0.7) * (r.grounded ? 0.55 : 1);
    L.v += (target - L.a) * (r.grounded ? 0.14 : 0.07);
    L.v *= r.grounded ? 0.82 : 0.93;
    L.a += L.v;
    if (L.a > 1.9) { L.a = 1.9; L.v *= -0.3; }
    if (L.a < -1.9) { L.a = -1.9; L.v *= -0.3; }
  }
}

function drawRagdoll(e) {
  const spr = e.spr, rig = spr.rig, r = e.rag;
  if (r && FS[e.sprName]) {
    const mode = e.deadT < 5 ? 'white' : null;
    if (r.grounded && Math.abs(r.rotV) < 0.08) {
      drawCharFrame(e.sprName, 'down', e.x, e.y, e.face, mode, 0, e.missing);
    } else {
      const q = Math.round(r.rot / (Math.PI / 2)) * (Math.PI / 2);
      drawCharFrame(e.sprName, 'air', e.x, e.y - r.z, e.face, mode, q, e.missing);
    }
    return;
  }
  if (!rig || !r) {
    const t = Math.min(1, e.deadT / 22);
    drawRaw(spr, e.x, e.y, e.face, 1 - t * 0.8, 1 + t * 0.25, null);
    return;
  }
  const S = SCALE, W = spr.w, H = spr.h;
  const rq = Math.round(r.rot / RQ) * RQ;
  ctx.save();
  ctx.translate(Math.round(e.x), Math.round(e.y - r.z));
  ctx.scale(e.face, 1);
  ctx.rotate(rq);
  for (let i = 0; i < rig.length; i++) {
    const p = rig[i];
    const L = r.limbs[p.n];
    ctx.save();
    ctx.translate((p.px - W / 2) * S, -(H - p.py) * S);
    if (L) { const a = Math.round(L.a / RQ) * RQ; if (a) ctx.rotate(a); }
    const im = e.deadT < 5 ? p.white : p.img;
    ctx.drawImage(im, (p.x - p.px) * S, (p.y - p.py) * S, p.w * S, p.h * S);
    ctx.restore();
  }
  ctx.restore();
}

/* ====================== PLAYER: FRAME-BY-FRAME ======================
   The instructor is drawn from a baked sheet of hand-authored frames
   (side, front and back views). Enemies still use the limb rig. */
let PF = null;
const FS = {};          // every character's baked frames: FS[sprName] = { meta, f: { name: {img, white, red} } }

// white / red versions are made the first time they are needed
function variant(o, mode) {
  if (mode === 'white') return o.white || (o.white = tint(o.img, '#fff'));
  if (mode === 'red') return o.red || (o.red = tint(o.img, '#ff4d4d'));
  if (mode === 'ghostB') return o.gb || (o.gb = tint(o.img, '#7fd3ff'));
  if (mode === 'ghostR') return o.gr || (o.gr = tint(o.img, '#ff5a5a'));
  return o.img;
}

function sliceFrameSets() {
  if (typeof FRAME_SETS === 'undefined') return;
  for (const who in FRAME_SETS) {
    const sheet = SPR[who + '_sheet'], meta = FRAME_SETS[who];
    if (!sheet) continue;
    const cut = (x, y) => {
      const c = document.createElement('canvas');
      c.width = meta.w; c.height = meta.h;
      c.getContext('2d').drawImage(sheet.img, x, y, meta.w, meta.h, 0, 0, meta.w, meta.h);
      return c;
    };
    const f = {};
    for (const name in meta.frames) {
      const [x, y] = meta.frames[name];
      if (meta.bands) {                      // limb-layered: one band per layer
        const layers = {};
        meta.bands.forEach((b, k) => { layers[b] = { img: cut(x, y + k * meta.bandH) }; });
        f[name] = { layers, stumps: (meta.stumps || {})[name] || {}, boxes: (meta.boxes || {})[name] || {} };
      } else {
        f[name] = { img: cut(x, y) };
      }
    }
    FS[who] = { meta, f, layered: !!meta.bands };
  }
  if (FS.instructor) PF = FS.instructor.f;
  // elite palettes: rotate the hue of clothes and hair; skin colours (listed per elite) and greys stay
  for (const k in ELITES) {
    const el = ELITES[k], base = FS[el.base];
    if (!base || !SPR[el.base]) continue;
    const f = {};
    for (const name in base.f) {
      const fr = base.f[name];
      if (fr.layers) {
        const layers = {};
        for (const b in fr.layers) layers[b] = { img: recolor(fr.layers[b].img, el.hue, el.keep) };
        f[name] = { layers, stumps: fr.stumps, boxes: fr.boxes };
      } else f[name] = { img: recolor(fr.img, el.hue, el.keep) };
    }
    FS[el.spr] = { meta: base.meta, f, layered: base.layered };
    const img = recolor(SPR[el.base].img, el.hue, el.keep);
    SPR[el.spr] = Object.assign({}, SPR[el.base], { img, white: tint(img, '#fff'), red: tint(img, '#ff4d4d') });
  }
}

function recolor(src, hue, keep) {
  const skin = new Set((keep || []).map(h => parseInt(h, 16)));

// draw a baked frame with its anchor on (x, y); rot is an exact multiple of 90 degrees
const DRAW_ORDER = ['armF', 'legF', 'body', 'head', 'legN', 'armN'];

function drawCharFrame(who, name, x, y, face, mode, rot, missing) {
  const set = FS[who];
  if (!set) return false;
  const fr = set.f[name] || set.f.idle0;
  if (!fr) return false;
  const S = SCALE, m = set.meta;
  const ax = m.anchor[0], ay = m.anchor[1];
  const dx = -Math.round((ax + 0.5) * S), dy = -(ay + 1) * S;
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(face, 1);
  if (rot) {
    const cy = -(ay + 1) * S / 2;               // spin around the middle of the body
    ctx.translate(0, cy); ctx.rotate(rot); ctx.translate(0, -cy);
  }
  if (fr.layers) {
    for (const k of DRAW_ORDER) {
      if (missing && missing.has(k)) continue;
      const L = fr.layers[k];
      if (L) ctx.drawImage(variant(L, mode), dx, dy, m.w * S, m.h * S);
    }
    if (missing && missing.size && mode !== 'white') {
      missing.forEach(k => {                    // raw stump where the limb used to be
        const st = fr.stumps[k];
        if (!st) return;
        const px = dx + st[0] * S, py = dy + st[1] * S;
        ctx.fillStyle = '#6d0710'; ctx.fillRect(px - S * 0.5, py - S * 0.5, S * 2, S * 2);
        ctx.fillStyle = '#e01e2a'; ctx.fillRect(px, py, S, S);

    }
  } else {
    ctx.drawImage(variant(fr, mode), dx, dy, m.w * S, m.h * S);
  }
  ctx.restore();
  return true;
}

// where a limb joins the body, in world space, for the frame being shown
function stumpWorld(e, fname, limb) {
  const set = FS[e.sprName];
  if (!set || !set.layered) return null;
  const fr = set.f[fname], st = fr && fr.stumps[limb];
  if (!st) return null;
  const S = SCALE, ax = set.meta.anchor[0], ay = set.meta.anchor[1];
  return { x: e.x + e.face * (st[0] - ax) * S, y: e.y - (e.airY || 0) + (st[1] - ay - 0.5) * S };
}

function enemyFrame(e) {
  const t = e.animT, set = FS[e.sprName].f;
  const cyc = (names, hold) => names[Math.floor(t / hold) % names.length];
  const has = n => !!set[n];
  const mv = (EMOVES[e.moveName] && EMOVES[e.moveName].anim) || e.moveName;
  if (e.st === 'holding') return has('jab_a') ? 'jab_a' : 'idle0';
  if (e.st === 'revive') return has('getup') ? 'getup' : 'idle0';
  const moving = e.st === 'enter' || Math.hypot(e.mvx || 0, e.mvy || 0) > 0.12;
  if (e.crawl) {                                   // no legs left: dragging along the floor
    if (e.st === 'air' || e.st === 'thrown' || e.st === 'held') return 'air';
    if (e.st === 'tele') return 'crawl1';
    if (e.st === 'act') return 'crawl0';
    return moving ? cyc(['crawl0', 'crawl1'], 12) : 'crawl0';
  }
  if (e.st === 'maimed') return e.maimFrame || 'hurt';
  if (e.cutT) return e.cutT === 1 ? 'hurt' : (has('stag1') ? 'stag1' : 'hurt');     // head in a cutter
  if (e.hopT > 0) return e.hopT > 12 ? 'hop0' : 'hop1';
  if (e.st === 'climb') {                                // hauling themselves up: back to camera, then crouched on top
    const k = 1 - e.f / e.pk.n;
    if (k > 0.75) return has('getup') ? 'getup' : 'idle0';
    return has('backW0') ? cyc(['backW0', 'backW1', 'backW2', 'backW3'], 4) : 'walk0';
  }
  if (mv === 'headbutt' && (e.st === 'tele' || e.st === 'act' || e.st === 'rec')) {
    return e.st === 'tele' ? 'stag1' : e.st === 'act' ? 'stag0' : 'idle0';
  }
  switch (e.st) {
    case 'tele': {
      // wind up, hold the telegraph, then whip through the in-between in the last few frames
      const k = e.move && e.move.wind ? 1 - e.f / e.move.wind : 1;
      if (e.f <= 3 && has(mv + '_m')) return mv + '_m';

    case 'act': {                                   // swing through the in-between, then hold the hit

  if ((e.st === 'enter' || sp > 0.22) && e.prevSt !== 'enter' && t < 3 && e.st === 'idle' && has('walkIn')) return 'walkIn';

      return cyc((e.mvy > 0 ? ['frontW0', 'frontW1', 'frontW2', 'frontW3'] : ['backW0', 'backW1', 'backW2', 'backW3']), 7);
    }

/* Attack timelines. Each move's wind-up, active and recovery phases get their own
   frame lists; [name, weight] holds a frame longer. The rule: rush through the
   in-betweens, hold the wind-up and the moment of impact. */
const ATTACK_TL = {
  wpnL:   { wind: [['hookW', 3], 'hookM'],                   act: ['hookS'],   rec: ['hookF', 'hookR'] },
  wpnH:   { wind: [['axeW', 4], 'axeM'],                     act: ['axeS'],    rec: ['axeR', 'idle0'] },
  counter:{ wind: ['hookW'],                                 act: ['hookS'],   rec: ['hookF', 'hookR'] },

  // when the hit lands (and while the hit-freeze holds it)
  l1:     { wind: [['jabW', 2], 'jabM'],                     act: ['jabS'],    rec: ['jabR', 'jabR2'] },
  l2:     { wind: [['kickW', 3], 'kickM'],                   act: ['kickS'],   rec: ['kickR', 'kickR2'] },
  l3:     { wind: [['hookW', 4], ['hookM', 2]],              act: ['hookS'],   rec: ['hookF', ['hookR', 2]] },
  heavy:  { wind: [['hvyW1', 5], ['hvyW2', 5], 'hvyM1', 'hvyM2'], act: ['hvyS'], rec: ['hvyF', ['hvyR', 2], 'hvyR2'] },
  launch: { wind: [['upW', 6], ['upM', 3]],                  act: ['upS'],     rec: ['upR', 'upR2'] },
  dash:   { wind: [['hookW', 3], 'jabM'],                    act: ['jabS'],    rec: ['jabR', 'jabR2'] },
  air:    { wind: [['jumpUp', 2], ['airKickM', 2]],          act: ['airKick'], rec: ['airKick', 'jumpPeak'] },
  airL:   { wind: ['airKickM'],                              act: ['airKick'], rec: ['airKick', 'jumpPeak'] },
  airH:   { wind: ['slam'],                                  act: ['slam'],    rec: ['slam'] },
  grab:   { wind: ['grabM'],                                 act: ['grab'],    rec: ['grab', 'carry0'] },
  toss:   { wind: [['carry0', 2], ['throwM', 2]],            act: ['throw'],   rec: ['throw'] },
  whistle:{ wind: ['blockIn', 'block'],                      act: ['upS'],     rec: ['upR', 'upR2'] }

function phasePick(list, el, len) {

    if (pos < w) return Array.isArray(it) ? it[0] : it;

  if (e < mv.wind + mv.act) return phasePick(tl.act, e - mv.wind, mv.act);
  return phasePick(tl.rec, e - mv.wind - mv.act, mv.rec);

function playerFrame(p) {
  const t = p.animT;
  const cyc = (names, hold) => names[Math.floor(t / hold) % names.length];
  if (p.carry && p.st !== 'attack') {
    return (p.st === 'walk' || p.st === 'run') ? cyc(['carryW0', 'carryW1'], 6) : cyc(['carry0', 'carry1'], 18);
  }
  const airFrame = () => p.slamming ? 'slam'
    : p.flipT > 0 ? ['tuck', 'roll1', 'roll2', 'roll3'][Math.floor((16 - p.flipT) / 4) % 4]     // flipping off a wall
    : (p.airV > 1.2 ? 'jumpUp' : p.airV > -1.2 ? 'jumpPeak' : 'jumpDn');
  if (p.st === 'vault') { const k = 1 - p.f / p.pk.n; return k < 0.3 ? 'vault1' : k < 0.55 ? 'vaultM' : 'vault2'; }
  if (p.st === 'mantle') {
    const k = 1 - p.f / p.pk.n;
    if (p.pk.hang) return k < 0.3 ? 'hang' : k < 0.5 ? 'pullM' : k < 0.7 ? 'pull' : k < 0.85 ? 'mantleM' : 'mantle';
    return k < 0.35 ? 'pull' : k < 0.65 ? 'mantleM' : 'mantle';
  }
  if (p.st === 'wallkick') return 'wallKick';
  if (p.st === 'pinned') return (p.animT >> 2) % 2 ? 'hurt' : 'frontHurt';
  if (p.st === 'cutter') { const t = 34 - p.f; return t < 4 ? 'cutter1' : t < 8 ? 'cutterM' : t < 13 ? 'cutter2' : t < 30 ? 'cutLand' : 'landR'; }
  if (p.st === 'roll') return p.f > 2 ? ['tuck', 'roll1', 'roll2', 'roll3'][Math.floor((18 - p.f) / 4) % 4] : 'landR';
  if (p.airY > 0 && p.st !== 'attack') return airFrame();
  switch (p.st) {
    case 'idle':
      if (p.charge > 0 && T.charging) return p.charge >= 1 && t % 10 < 5 ? 'hvyW2' : 'hvyW1';
      if (p.skidT > 0) return 'skid';
      if (p.turnT > 0) return 'frontIdle';
      if ((p.prevSt === 'walk' || p.prevSt === 'run') && t < 4) return 'walkOut';
      if (p.prevSt === 'hurt' && t < 5) return 'hurtR';
      return cyc(['idle0', 'idle1'], 28);
    case 'walk':
      if (p.view === 'front') return cyc(['frontW0', 'frontW1', 'frontW2', 'frontW3'], 5);
      if (p.view === 'back')  return cyc(['backW0', 'backW1', 'backW2', 'backW3'], 5);
      if (p.charge > 0 && T.charging) return 'hvyW1';
      if (p.skidT > 0) return 'skid';
      if (p.turnT > 0) return 'frontIdle';
      if (p.prevSt === 'idle' && t < 3) return 'walkIn';
      return cyc(['walk0', 'walk1', 'walk2', 'walk3', 'walk4', 'walk5'], 4);
    case 'run':
      if (p.skidT > 0) return 'skid';
      return cyc(['run0', 'run1', 'run2', 'run3'], 4);
    case 'block': case 'blockstun': return t < 2 && p.st === 'block' ? 'blockIn' : 'block';
    case 'hurt': return p.view === 'front' ? 'frontHurt' : (t < 7 ? 'hurt' : 'hurtR');
    case 'gassed': return 'gassed';
    case 'down': return 'down';
    case 'land': return p.prevSt === 'mantle' ? (p.f > 3 ? 'mantle' : 'mantleR') : p.f > 3 ? 'land' : 'landR';

function drawPlayerFrame(p, x, y, mode) {
  drawCharFrame(state === 'title' || state === 'select' ? 'instructor' : playerSheet(), playerFrame(p), x, y, p.face, mode, 0);
}

/* ====================== DISMEMBERMENT ======================
   Big hits can take limbs off. Which limb depends on the hit; the limb flies
   off as a prop you can pick up and throw; the stump bleeds in pulses; and the
   enemy keeps fighting with what it has left. */
const SEVER_KIND = { l1: 'arm', l3: 'arm', heavy: 'arm', dash: 'arm', l2: 'leg', air: 'leg',
                     airL: 'leg', shock: 'leg', launch: 'head', airH: 'head' };
const LIMB_LABEL = { armN: 'ARM OFF!', armF: 'ARM OFF!', legN: 'LEG OFF!', legF: 'LEG OFF!', head: 'DECAPITATED' };

// what each enemy move physically needs
const NEEDS = {
  jab: ['armN'], swing: ['armN'], poke: ['armN'],
  slam: ['armN', 'armF'], grab: ['armN', 'armF'], volley: ['anyArm'],
  sweep: ['legN'], stomp: ['legN'],
  dashin: ['legN', 'legF'], charge: ['legN', 'legF'], rush: ['legN', 'legF'],
  hopback: ['anyLeg'], bite: [], headbutt: [], crawlbite: [],
  belly: [], hammer: ['anyArm'], burger: ['armN'], flop: ['legN', 'legF'], hug: ['armN', 'armF'], cup: ['armN'],
  slap: ['armN'], clap: ['armN', 'armF'], pound: ['anyArm'], flex: ['armN', 'armF'],
  ram: [], wheelie: [], flash: [], whack: [], scuttle: [],
  spatula: ['armN'], grease: ['anyArm'], cleaver: ['armN'], pansmash: ['legN', 'legF'], tray: ['anyArm'],
  writeup: ['armN'], coffee: ['anyArm'], fired: ['legN', 'legF'], meeting: [],
  baton: ['armN'], taser: ['anyArm'], shove: ['legN', 'legF'], butt: ['armN'],
  lotus: [], stretch: ['armN'], claws: ['anyArm'], dog: ['anyArm'], tree: ['legN'], om: ['anyArm']

function canDo(e, m) {
  if (!e.missing || !e.missing.size) return true;
  if (e.crawl) return m === 'crawlbite' || m === 'bite';
  for (const k of (NEEDS[m] || [])) {
    if (k === 'anyArm') { if (e.missing.has('armN') && e.missing.has('armF')) return false; }
    else if (k === 'anyLeg') { if (e.missing.has('legN') && e.missing.has('legF')) return false; }
    else if (e.missing.has(k)) return false;
  }
  return true;
}
// choose a pattern made only of moves the enemy can still do
function pickMoves(e, list, near) {
  if (e.crawl) return near ? ['crawlbite'] : [];
  const options = list.map(pt => pt.filter(m => canDo(e, m))).filter(pt => pt.length);
  if (options.length) return pick(options).slice();
  return near ? ['headbutt'] : [];
}

function pickLimb(e, kind) {
  const m = e.missing;
  if (kind === 'head') return m.has('head') ? null : 'head';
  if (kind === 'arm') return !m.has('armN') ? 'armN' : !m.has('armF') ? 'armF' : null;
  if (kind === 'leg') return !m.has('legN') ? 'legN' : !m.has('legF') ? 'legF' : null;
  return null;
}

// may cut something off; returns true if it did
// Pete's legs: every kick wobbles him; enough of them and a leg goes (or he goes down)
function cameraFlash(e) {
  const p = player, inFront = (p.x - e.x) * e.face > 0 && Math.abs(p.x - e.x) < 150 && Math.abs(p.y - e.y) < 44;
  flashScreen = Math.max(flashScreen, 6); A.tone(2400, 1800, 0.08, 'square', 0.12);
  if (!inFront || p.dead) return;
  const looking = sgn(e.x - p.x) === p.face;
  if (!looking || p.blocking || p.iframes > 0 || p.airY > 6 || p.st === 'dodge') { say(p.x, p.y - 60, looking ? 'SAFE' : 'NOT LOOKING', '#8bc34a'); styleAdd('lookaway', 10); return; }

  say(p.x, p.y - 64, 'BLINDED!', '#fff', true); styleHurt(false); logEv('blinded');
}
let blindT = 0;
function legHit(e, dmg) {
  e.legDmg = (e.legDmg || 0) + dmg;
  e.poise -= 4;
  if (Math.random() < 0.5) say(e.x, e.y - 50, pick(['WOBBLE', 'NOT THE LEGS', 'TIMBER?']), '#ffd23f');
  if (e.legDmg < 34 || e.dead) return;
  e.legDmg = 0;
  const limb = gore && e.missing && FS[e.sprName] && FS[e.sprName].layered ? pickLimb(e, 'leg') : null;
  if (limb) sever(e, limb, player.face, false);
  else if (e.st !== 'down') { e.setState('down', 60); shake = Math.max(shake, 8); say(e.x, e.y - 60, 'TIMBER!', '#ff6b35', true); }
  styleAdd('legday', 20);

function limbCap(e) { return Math.max(12, e.maxhp * 0.28 * (1 - perk('limb'))); }
function trySever(e, kind, dmg, killing, dirX) {
  if (!gore || !e.missing || !FS[e.sprName] || !FS[e.sprName].layered) return false;
  let chance;
  if (killing) chance = dmg >= 13 ? 0.72 : 0.3;
  else {
    if (dmg < 11 || e.hp > e.maxhp * 0.85) return false;   // not on fresh enemies
    chance = clamp((dmg - 8) / 24, 0, 0.55);
  }
  if (Math.random() > chance) return false;

  if (killing && kind === 'arm' && dmg >= 20 && Math.random() < 0.3) kind = 'head';

  sever(e, limb, dirX || player.face, killing);

}

function sever(e, limb, dirX, killing) {
  if (e.t && (e.t.noGore || e.t.noSever)) return;
  if (roundStats) roundStats.sev++;
  e.queue = [];                                    // whatever they were about to do may need that limb
  const fname = enemyFrame(e);
  spawnLimbProp(e, limb, fname, dirX);
  e.missing.add(limb);
  const sp = stumpWorld(e, fname, limb) || { x: e.x, y: e.y - e.h * 0.5 };
  bloodSpray(sp.x, sp.y, e.y, 26, dirX, 1.7);
  burst(sp.x, sp.y, 10, '#ff2d2d', 3);
  say(e.x, e.y - e.h - 16, LIMB_LABEL[limb], '#ff2d2d', true);
  A.sever();
  hitStop = Math.max(hitStop, 11); shake = Math.max(shake, 9); flashScreen = Math.max(flashScreen, 3);
  score += 150;
  e.bleedT = 0;
  logEv('sever:' + limb);
  if (killing) return;
  e.hop = e.missing.has('legN') !== e.missing.has('legF');
  e.crawl = e.missing.has('legN') && e.missing.has('legF');

  if (limb.startsWith('arm')) { e.setState('maimed', 38); e.maimFrame = limb === 'armN' ? 'clutchN' : 'clutchF'; }
  else if (e.crawl) { e.setState('maimed', 42); e.maimFrame = 'crawl0'; }

// the severed limb becomes a prop: it flies, bleeds, lands, and can be thrown
function spawnLimbProp(e, limb, fname, dirX) {
  const set = FS[e.sprName], fr = set.f[fname];

  const bb = fr.boxes[limb];
  if (!bb) return;
  const [x0, y0, x1, y1] = bb, w = x1 - x0, h = y1 - y0;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (e.face < 0) { g.translate(w, 0); g.scale(-1, 1); }
  g.drawImage(fr.layers[limb].img, x0, y0, w, h, 0, 0, w, h);
  const S = SCALE, ax = set.meta.anchor[0], ay = set.meta.anchor[1];
  const o = makeProp('limb', e.x + e.face * ((x0 + x1) / 2 - ax - 0.5) * S, e.y);
  o.img = c; o.iw = w * S; o.ih = h * S;

  o.z = Math.max(0, (ay + 1 - y1) * S + (e.airY || 0));

  o.rotV = dirX * rnd(0.25, 0.45);

// stumps spurt in time with a slowing heartbeat, and they bleed out

    const pulse = Math.min(40, 14 + ((e.bleedT / 150) | 0) * 4);

  const it = ITEMS[id], old = gear[it.slot] && ITEMS[gear[it.slot]];
  const dHp = (it.fx.hp || 0) - ((old && old.fx.hp) || 0);
  gear[it.slot] = id;
  player.maxhp += dHp; player.hp = Math.max(1, Math.min(player.maxhp, player.hp + Math.max(0, dHp)));
  if (it.fx.killHeal || it.fx.hp) player.hp = Math.min(player.maxhp, player.hp + 10);
  buildSkin();
  A.rank(); flashScreen = 5; ring(player.x, player.y - 20, it.col, 4, 30);
  say(player.x, player.y - 70, 'EQUIPPED ' + it.name, it.col, true);
  logEv('equip:' + id);
}
/* recolour his frames to match what he's wearing: hands, shoes, shirt */
function buildSkin() {
  const base = FS[C().sheet];
  if (!base) return;
  const pal = base.meta.pal || {}, swap = [];
  const add = (k, rgb, dark) => { if (pal[k]) swap.push([pal[k], dark ? rgb.map(v => Math.round(v * 0.72)) : rgb]); };
  for (const sl of SLOTS) {
    const it = gear[sl] && ITEMS[gear[sl]];
    if (!it || !it.pal) continue;
    if (it.pal.hand) { add('W', it.pal.hand); add('w', it.pal.hand, true); }
    if (it.pal.shoe) { add('S', it.pal.shoe); add('s', it.pal.shoe, true); }
    if (it.pal.shirt) { add('D', it.pal.shirt); add('d', it.pal.shirt, true); }
  }
  if (!swap.length) { delete FS.pskin; return; }
  const f = {};
  for (const name in base.f) {
    const src = base.f[name].img, c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const g = c.getContext('2d'); g.drawImage(src, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height), px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      if (!px[i + 3]) continue;
      for (const [from, to] of swap)
        if (px[i] === from[0] && px[i + 1] === from[1] && px[i + 2] === from[2]) { px[i] = to[0]; px[i + 1] = to[1]; px[i + 2] = to[2]; break; }
    }
    g.putImageData(d, 0, 0);
    f[name] = { img: c };
  }
  FS.pskin = { meta: base.meta, f, layered: false };
}
const playerSheet = () => (FS.pskin && state !== 'title' && state !== 'select') ? 'pskin' : C().sheet;

// this class's version of a move: its own numbers layered over the shared ones
function classMove(mv) {
  const o = C().moves[mv.name];
  let m = o ? Object.assign({}, mv, o) : mv;
  const q = perk('quick');
  if (q) m = Object.assign({}, m, { rec: Math.max(3, Math.round(m.rec * (1 - q))) });
  if (m.name === 'dash' && (perk('dash') || perk('breakaway')))
    m = Object.assign({}, m, { dmg: Math.round(m.dmg * (1 + perk('dash'))), knockdown: m.knockdown || !!perk('breakaway') });
  return m;
}

  pts += rs.combo >= 15 ? 3 : rs.combo >= 10 ? 2 : rs.combo >= 5 ? 1 : 0;
  pts += secs <= par ? 2 : secs <= par * 1.5 ? 1 : 0;

        e.flash = 12; e.poise = e.maxpoise; e.queue = [];
      }
      if (e.vx != null) e.vx += sgn(e.x - p.x) * 3;
      p.canCancel = true;
      // COUNTER: the parry turns straight into a hit back
      p.face = sgn(e.x - p.x) || p.face;
      p.move = classMove(PMOVES.counter); p.hitSet = new Set(); p.hitLanded = false; p.lunge = null;
      p.blocking = false; p.chain = 0;
      p.setState('attack', p.move.wind + p.move.act + p.move.rec);
      say(p.x, p.y - 72, 'COUNTER', '#ffd23f', true);
      logEv('counter');
      logEv('parry');
      return 'parry';
    }
    // normal block
    const chip = Math.max(perk('chip') ? 0 : 1, Math.round(mv.dmg * 0.15 * (1 - perk('chip'))));
    p.hp -= chip; dmgTaken += chip;
    p.stam -= mv.dmg * 1.7;
    p.vx += sgn(p.x - e.x) * 2.6;
    A.block();
    hitStop = 3; shake = 2.5;
    burst(p.x + sgn(e.x - p.x) * 12, p.y - 32, 6, '#9fd0ff', 1.8);
    say(p.x, p.y - 56, 'BLOCK', '#9fd0ff');
    if (p.stam <= 0) {
      p.stam = 0; p.blocking = false;
      p.setState('gassed', 62);
      say(p.x, p.y - 62, 'GUARD BROKEN', '#ff5252', true);
      A.hurt(); shake = 7;
    } else {
      p.setState('blockstun', 10);
    }
    logEv('block');
    return 'block';
  }

  // clean hit
  const dmg = Math.max(1, Math.round(mv.dmg * (1 - perk('tough')) * (p.st === 'pinned' ? 1.3 : 1) * DIFF().dmg * (endlessMode ? 1 + round * 0.03 : 1) * (ngPlus ? 1.3 : 1)));   // held still: they hit harder
  // bodybuilder: a heavy swing being wound up or thrown can't be interrupted (red attacks still land)
  if (C().armor && p.st === 'attack' && p.move && p.move.name === 'heavy' && !unblockable) {
    const left = p.move.wind + p.move.act + p.move.rec - p.f;
    if (left < p.move.wind + p.move.act) {
      const ad = Math.round(dmg * 0.6);
      p.hp -= ad; dmgTaken += ad; p.flash = 6;
      say(p.x, p.y - 52, 'ARMOR -' + ad, '#ffb74d'); vibrate(p, 5, 1); A.block(); hitStop = 3;
      return 'hit';
    }
  }
  const wasAir = p.airY > 0;
  if (wasAir) { p.airY = 0; p.airV = 0; p.slamming = false; p.airActs = 0; }
  if (p.carry) {                                  // you drop it
    const c = p.carry; p.carry = null; c.ref.held = false;
    if (c.kind === 'foe') { c.ref.setState('down', 60); c.ref.airY = 0; }
    else { c.ref.vx = rnd(-2, 2); c.ref.vz = 1.4; }
  }
  p.hp -= dmg; dmgTaken += dmg;
  if (e && e.t && e.t.boss && e.pips) { e.pips = 0; say(e.x, e.y - 94, 'BREAK RESET', '#6b6388'); }
  styleHurt(mv.knockdown);
  p.iframes = mv.knockdown ? 60 : 42;
  p.flash = 9;
  combo = 0;
  p.chain = 0;
  p.vx += sgn(p.x - e.x) * (mv.knockdown ? 7 : 4);
  { const d = sgn(p.x - e.x);                                   // the player feels it too
    impact(p.x - d * 6, p.y - 30, d, !!mv.knockdown); vibrate(p, mv.knockdown ? 9 : 6, mv.knockdown ? 2 : 1); }
  A.hurt();
  hitStop = 5; shake = mv.knockdown ? 9 : 5;
  burst(p.x, p.y - 30, 9, '#ff5252', 2.6);
  bloodSpray(p.x, p.y - 30, p.y, dmg > 14 ? 8 : 4, sgn(p.x - e.x), dmg > 14 ? 1.2 : 0.8);
  say(p.x, p.y - 52, '-' + dmg, '#ff5252');
  const stand = perk('unstoppable') && p.hp > p.maxhp / 2;
  const pulled = p.baseZ > (e.baseZ || 0) + 4 && p.under && !stand;
  if (p.st === 'pinned') { p.iframes = 26; }                   // still held: the hit lands but he can't go anywhere
  else if ((mv.knockdown || wasAir || pulled) && !stand) { p.setState('down', 70); A.down(); }
  else p.setState('hurt', 14);
  if (pulled) {                                    // grabbed by the ankle and dragged off whatever he was standing on
    const u = p.under;
    if (Math.abs(e.x - u.x) > u.w) p.x = clamp(u.x + sgn(e.x - u.x) * (u.w + 9), WALL_L, WALL_R);
    else p.y = clamp(u.y + (sgn(e.y - u.y) || 1) * (u.d + 7), DEPTH_TOP, FLOOR_BOT);
    p.airY = p.baseZ; p.baseZ = 0; p.airV = 1.5; p.peakZ = p.airY; p.vx = 0; p.vy = 0; p.under = null;
    say(p.x, p.y - p.airY - 64, 'PULLED DOWN', '#ff5252', true);
    logEv('pulled');
  }
  p.charge = 0;
  logEv(mv.kind === 'red' ? 'hit-red' : 'hit');
  return 'hit';
}

/* ============================== PLAYER ============================== */
function updatePlayer() {
  const p = player;
  p.anim += (p.st === 'walk' ? 0.24 : 0.09);
  p.animT++;
  if (p.turnT > 0) p.turnT--;
  if (p.skidT > 0) p.skidT--;
  if (p.furyT > 0) {                                  // in fury: embers, and it runs out
    p.furyT--;
    if (classTime % 3 === 0) parts.push({ x: p.x + rnd(-8, 8), y: p.y - rnd(4, 40), vx: rnd(-0.3, 0.3), vy: rnd(-1.4, -0.6),
                                          g: 0, life: rnd(14, 24), col: pick(['#ff6b35', '#ffd23f', '#ff3b3b']), s: rnd(1, 2) });
    if (p.furyT === 0) { p.fury = 0; say(p.x, p.y - 60, 'FURY SPENT', '#b8aed0'); }
  } else if (p.fury > 0 && comboT === 0) p.fury = Math.max(0, p.fury - 0.07);
  if (p.flash > 0) p.flash--;
  if (p.iframes > 0) p.iframes--;
  if (p.chainT > 0) p.chainT--; else p.chain = 0;
  if (p.f > 0) p.f--;
  carryFollow();

  /* ---------- vertical physics ---------- */
  if (p.flipT > 0) p.flipT--;
  if (p.dodgeT !== undefined) p.dodgeT++;
  stepStyle();
  const scripted = p.st === 'vault' || p.st === 'mantle' || p.st === 'wallkick' || p.st === 'cutter';
  if (!scripted && (p.airY > 0 || p.airV !== 0)) {
    const hover = (p.st === 'attack' && !p.slamming) ? 0.55 : 1;
    p.airY += p.airV;
    p.airV -= GRAV * hover;
    p.peakZ = Math.max(p.peakZ || 0, (p.baseZ || 0) + p.airY);
    if (p.airY <= 0) {
      p.airY = 0; p.airV = 0;
      const drop = (p.peakZ || 0) - (p.baseZ || 0);
      p.peakZ = p.baseZ || 0; p.flipT = 0;
      const hard = p.slamming;
      p.slamming = false; p.airActs = 0; p.wallJumps = 0;
      if (hard) slamShock(drop);
      if (p.st === 'down' || p.st === 'hurt') { /* knocked off something: stay down */ }
      else if (!hard && drop > 34 && Math.abs(p.vx) > 0.9) startRoll(p);      // a long drop on the move: roll out of it
      else p.setState('land', hard ? 15 : drop > 34 ? 11 : 5);
      A.land(hard);
      burst(p.x, p.y, hard ? 8 : 2, '#d7c3a1', hard ? 3.2 : 1.5);
      dust(p.x, p.y, hard ? 9 : 4, 0);
      if (hard) { shake = 9; ring(p.x, p.y, '#ffd23f', 6, 58); }
    }
  }
  const air = p.airY > 0;

  const regen = ((p.st === 'idle' || p.st === 'walk') ? 0.62 : 0.2) * C().stamRegen * (1 + perk('stam'));
  if (p.st === 'run' && perk('draft')) p.super = Math.min(p.maxsuper, p.super + 0.14);
  if (p.st !== 'block') p.stam = Math.min(p.maxstam, p.stam + regen);
  else p.stam = Math.min(p.maxstam, p.stam + 0.06);

  /* ---------- input ---------- */
  let ix = 0, iy = 0;
  if (held('a') || held('arrowleft')) ix -= 1;
  if (held('d') || held('arrowright')) ix += 1;
  if (held('w') || held('arrowup')) iy -= 1;
  if (held('s') || held('arrowdown')) iy += 1;
  ix += T.dx + GP.dx; iy += T.dy + GP.dy;
  const mag = Math.hypot(ix, iy);
  if (mag > 1) { ix /= mag; iy /= mag; }

  if (T.flickFaceT > 0) T.flickFaceT--;
  // holding the action pad still winds up a heavy; it builds only while you're free to act
  const canWind = !air && (p.st === 'idle' || p.st === 'walk' || p.st === 'run') && !p.carry;
  if (T.charging && canWind && has('charge')) {
    const was = p.charge || 0;
    p.charge = Math.min(1, was + (1 + perk('charge')) / 48);
    if (was < 1 && p.charge >= 1) { A.tone(660, 1320, 0.12, 'square', 0.14); ring(p.x, p.y - 22, '#ffd23f', 4, 22); }
    if (p.charge >= 1 && classTime % 5 === 0) parts.push({ x: p.x + rnd(-9, 9), y: p.y - rnd(10, 40), vx: 0, vy: -0.6, g: 0, life: 14, col: '#ffd23f', s: 1 });
  } else if (!T.charging && !T.chargeRelease && !tapped('k')) p.charge = 0;

  const wantLight   = tapped('j') || T.lightEdge;
  const wantHeavy   = tapped('k') || T.heavyEdge;
  const wantGrab    = tapped('l') || T.dodgeEdge;
  const wantJump    = tapped('space') || T.jumpEdge;
  const wantBlock   = held('h') || held('shift') || T.block;
  const wantWhistle = tapped('u') || T.whistleEdge;

  let threat = null, td = 1e9;
  enemies.forEach(e => {
    if (e.dead) return;
    const d = Math.hypot(e.x - p.x, (e.y - p.y) * 1.6);
    if (d < td) { td = d; threat = e; }
  });

  /* ---------- locked states ---------- */
  if (p.st === 'vault') { stepVault(p, wantLight, wantHeavy, threat); clearEdges(); return; }
  if (p.st === 'mantle') { stepMantle(p); clearEdges(); return; }
  if (p.st === 'wallkick') { stepWallKick(p); clearEdges(); return; }
  if (p.st === 'pinned') { stepPinned(p, wantLight || wantHeavy || wantJump || wantGrab); clearEdges(); return; }
  if (p.st === 'cutter') { p.iframes = Math.max(p.iframes, 2); stepCutter(p); clearEdges(); return; }
  if (p.st === 'roll') {
    p.vx = p.face * (p.f > 6 ? 3.3 : 1.4); p.vy *= 0.5;
    if (p.f <= 0) p.setState('idle');
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'finish') { updateFinisher(p); stepPhysics(p); clearEdges(); return; }
  if (p.st === 'down') {
    p.iframes = Math.max(p.iframes, 2);
    if (p.f <= 0) { p.setState('idle'); p.iframes = 26; }
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'land') {
    if (p.f <= 0) p.setState('idle');
    p.vx *= 0.7;
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'gassed' || p.st === 'hurt' || p.st === 'blockstun') {
    if (p.f <= 0) p.setState('idle');
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'dodge') {
    p.iframes = Math.max(p.iframes, p.f > 6 ? 2 : 0);
    if (p.dodgeT <= 6) checkPerfect(p, 'dodge');          // a beat of grace: the swing can start just after you go
    if (p.f <= 0) p.setState('idle');
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'attack') {
    const mv = p.move;
    const total = mv.wind + mv.act + mv.rec, t = total - p.f;
    if (p.lunge && t < mv.wind + 1) {                  // flying across to the target
      const e = p.lunge.e;
      if (e.dead) p.lunge = null;
      else {
        const tx = e.x - p.face * p.lunge.stop;
        p.x += (tx - p.x) * 0.42; p.y += (e.y - p.y) * 0.42; p.vx = 0; p.vy = 0;
        if (classTime % 2 === 0) dust(p.x, p.y, 1, -p.face);
      }
    }
    if (t >= mv.wind && t < mv.wind + mv.act) { p.lunge = null; resolvePlayerAttack(mv); }
    const inRecovery = t >= mv.wind + mv.act;
    if (inRecovery) {
      if (air && wantGrab) {
        const ct = cutterTarget(p);
        if (ct) { eat(['l']); T.dodgeEdge = false; startCutter(p, ct); return; }
      }
      if (!air && wantGrab) {
        eat(['l']); T.dodgeEdge = false;
        if (p.carry) { doThrow(); return; }
        if (p.weapon) { throwWeapon(); return; }
        if (tryGrab()) return;
      }
      if (!air && wantHeavy && p.stam >= 10) {
        const fe = findFinishable(p);
        if (fe) { eat(['k']); T.heavyEdge = false; startFinisher(p, fe); return; }
      }
      if (p.hitLanded || p.canCancel) {
        // jump-cancel: the route from a grounded combo into an air juggle
        if (!air && wantJump) { eat(['space']); T.jumpEdge = false; doJump(); return; }
        if (wantLight && p.stam >= 6 && (!air || p.airActs < 3 || (syn('THE MATRIX') && witchT > 0))) {
          eat(['j']); T.lightEdge = false; startChain('light', threat, air); return;
        }
        if (wantHeavy && p.stam >= 15 && (!air || p.airActs < 3 || (syn('THE MATRIX') && witchT > 0))) {
          eat(['k']); T.heavyEdge = false; startChain('heavy', threat, air); return;
        }
      }
    }
    if (p.f <= 0) { p.setState(air ? 'airborne' : 'idle'); p.canCancel = false; }
    if (air && Math.abs(ix) > 0.2) p.vx += ix * 0.18;
    else if (air) homeOnJuggle(p);
    if (air) p.vy = 0;
    stepPhysics(p); clearEdges(); return;
  }

  /* ---------- free ---------- */
  p.blocking = false;
  const fresh = mag > 0.55 && (p.prevMag || 0) < 0.35;
  p.prevMag = mag;
  if (!air && wantBlock && fresh && p.stam >= 18 && has('dodge')) { startDodge(ix, iy); clearEdges(); return; }   // block + a direction = dodge
  if (!air && wantBlock && p.stam > 2) {
    if (p.st !== 'block') { p.setState('block'); p.blockT = 0; }
    p.blocking = true; p.blockT++;
    if (threat) p.face = sgn(threat.x - p.x);
    p.vx *= 0.5; p.vy *= 0.5;
    stepPhysics(p); clearEdges(); return;
  }
  if (p.st === 'block') p.setState('idle');

  if (!air && wantWhistle && p.super >= p.maxsuper && has('whistle')) { eat(['u']); T.whistleEdge = false; doWhistle(); return; }
  if (!air && wantHeavy && !T.charging) {
    const fe = findFinishable(p);
    if (fe) { eat(['k']); T.heavyEdge = false; p.charge = 0; startFinisher(p, fe); return; }
  }
  if (!air && wantJump) {
    eat(['space']); T.jumpEdge = false;
    const mt = !p.carry && mantleTarget(p, ix, iy, true);
    if (mt) { startMantle(p, mt); return; }                 // right next to it: climb straight up
    doJump(); return;
  }
  if (!air && wantGrab && p.stam >= 6) {
    eat(['l']); T.dodgeEdge = false;
    if (p.carry) { doThrow(); return; }
    if (p.weapon) { throwWeapon(); return; }
    if (pickWeapon()) return;
    if (tryGrab()) return;
  }
  if (p.carry) {                                  // hands full: any attack throws
    if ((wantLight || wantHeavy) && !air) { eat(['j', 'k']); T.lightEdge = T.heavyEdge = false; doThrow(); return; }
  }
  if (wantLight && p.stam >= 6 && (!air || p.airActs < 3 || (syn('THE MATRIX') && witchT > 0))) {
    eat(['j']); T.lightEdge = false; startChain('light', threat, air); return;
  }
  if (wantHeavy && p.stam >= 15 && (!air || p.airActs < 3 || (syn('THE MATRIX') && witchT > 0))) {
    eat(['k']); T.heavyEdge = false; startChain('heavy', threat, air); return;
  }

  if (air && wantGrab && !p.carry) {
    const ct = cutterTarget(p);
    eat(['l']); T.dodgeEdge = false;
    if (ct) { startCutter(p, ct); return; }
    if (p.airActs < 3 && p.stam >= 15) { startChain('heavy', threat, true); return; }   // nobody to grab: slam instead
  }
  if (air && wantJump && !p.carry && (p.wallJumps || 0) < 3) {
    const wd = wallKickSide(p);
    if (wd) { eat(['space']); T.jumpEdge = false; startWallKick(p, wd); return; }
  }
  if (air && wantJump && !p.carry && absurd('djump') && ((p.djUsed || 0) < 1 || (syn('THE MATRIX') && witchT > 0))) {
    eat(['space']); T.jumpEdge = false; p.djUsed = (p.djUsed || 0) + 1;
    p.airV = JUMP_V * 0.95; p.airActs = 0; A.jump(); ring(p.x, p.y - (p.airY || 0), '#b388ff', 3, 18); say(p.x, p.y - 60 - (p.airY || 0), 'DOUBLE JUMP', '#b388ff');
    logEv('djump'); stepPhysics(p); clearEdges(); return;
  }
  if (air && !p.carry) {
    const mt = mantleTarget(p, ix, iy);
    if (mt) { startMantle(p, mt); clearEdges(); return; }
  }
  if (!air && !p.carry && (p.st === 'run' || p.runT > 16) && Math.abs(p.vx) > 1.8) {
    const vt = vaultTarget(p);
    if (vt) { startVault(p, vt); clearEdges(); return; }
  }
  if (air) {
    p.setState('airborne');
    if (Math.abs(ix) > 0.2) { p.vx += ix * 0.3; if (!(p.flipT > 0)) p.face = sgn(ix); }
    else homeOnJuggle(p);
    p.vy = 0;
  } else if (mag > 0.05) {
    const dir = Math.abs(ix) > 0.2 ? sgn(ix) : 0;
    // hold a direction and you build into a run
    if (dir && dir === p.runDir && mag > 0.7) p.runT++;
    else { p.runT = 0; p.runDir = dir; }
    const running = p.runT > 16;
    // skid when you reverse at speed
    if (dir && sgn(p.vx) !== dir && Math.abs(p.vx) > 2.6) {
      burst(p.x, p.y, 4, '#d7c3a1', 1.2);
      p.vx *= 0.55; p.runT = 0; p.skidT = 7;
    }
    p.setState(running ? 'run' : 'walk');
    if (dir && dir !== p.face && !p.skidT) p.turnT = 4;      // a quick front-on frame while turning round
    if (dir) p.face = dir;
    // walking mostly up or down the room shows his back or his front
    if (!running && Math.abs(iy) > Math.abs(ix) * 1.3) p.view = iy < 0 ? 'back' : 'front';
    else p.view = 'side';
    const wind = T.charging && p.charge > 0 ? 0.45 : 1;      // you shuffle while winding up a heavy
    const spd = C().speed * (1 + perk('speed')) * (running ? C().runK * (1 + perk('run')) : 1);
    p.vx += ix * (running ? 0.92 : 0.5) * wind * spd;
    p.vy += iy * (running ? 0.52 : 0.42) * wind * spd;
    if (running && p.animT % 9 === 0) burst(p.x - p.face * 6, p.y, 2, '#d7c3a1', 0.8);
  } else {
    if (p.st === 'run' && Math.abs(p.vx) > 2) { p.skidT = 9; dust(p.x + p.face * 6, p.y, 4); }
    p.runT = 0; p.runDir = 0;
    p.view = 'side';
    p.setState('idle');
    if (p.airY <= 0) { p.vx *= 0.52; p.vy *= 0.52; }   // stop crisply
  }
  stepPhysics(p);
  clearEdges();
}

// drift toward a juggled target so the string stays connected
function homeOnJuggle(p) {
  let best = null, bd = 1e9;
  enemies.forEach(e => {
    if (e.dead || e.st !== 'air') return;
    const d = Math.abs(e.x - p.x);
    if (d < 110 && Math.abs(e.y - p.y) < 26 && d < bd) { bd = d; best = e; }
  });
  if (!best) return;
  if (bd > 22) { p.vx += sgn(best.x - p.x) * 0.34; p.face = sgn(best.x - p.x); }
}

/* The grab button: pick up a crate, a kettlebell, or a floored client,
   then press it again to launch them. */
function tryGrab() {
  const p = player;
  if (!has('grab')) { lockedHint('GRAB'); return false; }
  const gR = absurd('magnet') ? 126 : 42, gY = absurd('magnet') ? 40 : 22;
  let best = null, bd = 1e9, kind = null;
  enemies.forEach(e => {
    if (e.dead || e.held || e.t.bike) return;
    if (e.st !== 'down' && e.st !== 'stagger' && e.st !== 'getup') return;
    const d = Math.abs(e.x - p.x);
    if (d < gR && Math.abs(e.y - p.y) < gY && d < bd) { bd = d; best = e; kind = 'foe'; }
  });
  if (!best) props.forEach(o => {
    if (o.gone || o.heavy > 9 || o.held) return;
    const d = Math.abs(o.x - p.x);
    if (d < 38 && Math.abs(o.y - p.y) < 20 && d < bd) { bd = d; best = o; kind = 'prop'; }
  });
  if (!best) return false;

  best.held = true;
  p.carry = { kind, ref: best };
  p.setState('attack', PMOVES.grab.wind + PMOVES.grab.act + PMOVES.grab.rec);
  p.move = PMOVES.grab; p.hitSet = new Set(); p.hitLanded = false;
  p.stam -= PMOVES.grab.stam;
  if (kind === 'foe') { best.setState('held', 999); best.hasToken = false; }
  A.light(0.7);
  say(p.x, p.y - 58, kind === 'foe' ? 'GRABBED' : 'PICKED UP', '#9fd0ff');
  return true;
}

function doThrow() {
  const p = player, c = p.carry;
  if (!c) return;
  p.carry = null;
  const o = c.ref;
  o.held = false;
  const spd = 12.5;
  if (c.kind === 'prop') {
    o.x = p.x + p.face * 10; o.y = p.y; o.z = 22;
    o.vx = p.face * spd; o.vy = 0; o.vz = 1.4;
    o.rotV = p.face * 0.3;
    o.thrown = 70;
  } else {
    o.x = p.x + p.face * 12; o.y = p.y;
    o.setState('thrown', 200);
    o.dropH = (p.baseZ || 0) >= 20 ? p.baseZ : 0;            // thrown off the top of something
    o.airY = 24 + (p.baseZ || 0); o.airV = 2.2; o.baseZ = 0;

/* Enemies hold a slot on a ring around the player rather than all walking
   at them in a line. Committed attackers cut straight in; everyone else
   circles, keeps apart, and favours the player's blind side. */
function steerEnemy(e, dx, dy, dist) {
  const p = player;

  if (e.orbit === undefined) {
    e.orbit = Math.atan2((e.y - p.y) * 2, e.x - p.x);
    e.orbitV = (Math.random() < 0.5 ? -1 : 1) * rnd(0.004, 0.013);
    e.laneBias = rnd(-7, 7);

  }

  // every so often pick a new drift, biased toward going behind the player
  if (--e.slotT <= 0) {
    e.slotT = (rnd(90, 200)) | 0;
    const behind = -p.face;
    const toBehind = sgn(Math.cos(e.orbit)) !== behind;
    e.orbitV = (toBehind ? behind : (Math.random() < 0.5 ? -1 : 1)) * rnd(0.005, 0.015);
    e.laneBias = rnd(-8, 8);

    // committed: close in on the side you are already on

    if (e.wantRange) close = Math.min(close, e.wantRange);       // the move they picked needs them closer
    tx = p.x + side * close;
    ty = p.y + e.laneBias * 0.35;
  } else {
    e.orbit += e.orbitV;
    const R = e.t.gap[1] + 10;

    ty = p.y + Math.sin(e.orbit) * R * 0.45 + e.laneBias * 0.3;
  }

  props.forEach(o => {
    if (!o.solid || o.gone || o.held || o.heavy < 9 || o.h <= ez + 1) return;
    if (canClimb(e) && player.under === o && player.baseZ > ez) return;     // they'll climb up to you

    }

  // aim above or below it until they're past

  if (Math.abs(tx - e.x) > 8) props.forEach(o => {
    if (!o.solid || o.gone || o.held || o.heavy < 9 || o.h <= ez + 1) return;
    const ahead = (o.x - e.x) * dirX;
    if (ahead > -4 && ahead < o.w + 34 && Math.abs(o.y - e.y) < o.d + 11 && (tx - o.x) * dirX > -o.w) {
      const up = o.y - o.d - 14, down = o.y + o.d + 14;
      const upOk = up >= DEPTH_TOP + 1, downOk = down <= FLOOR_BOT - 1;
      ty = !upOk ? down : !downOk ? up : (Math.abs(ty - up) < Math.abs(ty - down) ? up : down);
      if (Math.abs(o.y - e.y) < o.d + 9) tx = e.x + dirX * 3;     // still in its way: step round it first, then carry on
    }

  // keep out of each other and away from solid props

    }
  });
  props.forEach(o => {
    if (!o.solid || o.gone || o.held || o.h <= ez + 1) return;
    if (canClimb(e) && player.under === o && player.baseZ > ez) return;
